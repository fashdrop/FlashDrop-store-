<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>FlashDrop Store</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Tahoma,sans-serif;
}

body{
  background:#f5f7fb;
  color:#172033;
}

header{
  background:#111827;
  color:white;
  padding:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  font-size:22px;
  font-weight:bold;
}

.logo span{
  color:#22c55e;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:25px;
}

.card{
  background:white;
  border-radius:16px;
  padding:20px;
  box-shadow:0 5px 20px rgba(0,0,0,.06);
}

.stat-title{
  color:#6b7280;
  font-size:14px;
  margin-bottom:10px;
}

.stat-number{
  font-size:28px;
  font-weight:bold;
}

.green{color:#16a34a}
.blue{color:#2563eb}
.orange{color:#ea580c}
.red{color:#dc2626}

.section-title{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin:25px 0 15px;
}

button{
  border:0;
  border-radius:10px;
  padding:11px 16px;
  cursor:pointer;
  font-weight:bold;
}

.btn{
  background:#16a34a;
  color:white;
}

.btn-danger{
  background:#dc2626;
  color:white;
}

.products{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
}

.product img{
  width:100%;
  height:180px;
  object-fit:cover;
  border-radius:12px;
  margin-bottom:12px;
}

.product h3{
  font-size:16px;
  margin-bottom:8px;
}

.price{
  font-size:20px;
  font-weight:bold;
  color:#16a34a;
}

.old-price{
  text-decoration:line-through;
  color:#999;
  font-size:14px;
  margin-right:7px;
}

.product button{
  width:100%;
  margin-top:12px;
}

.orders{
  overflow-x:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  background:white;
  border-radius:12px;
  overflow:hidden;
}

th,td{
  padding:13px;
  border-bottom:1px solid #eee;
  text-align:center;
  white-space:nowrap;
}

th{
  background:#f3f4f6;
}

.status{
  padding:6px 10px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
}

.new{
  background:#dbeafe;
  color:#2563eb;
}

.done{
  background:#dcfce7;
  color:#15803d;
}

.cancel{
  background:#fee2e2;
  color:#dc2626;
}

.empty{
  text-align:center;
  padding:30px;
  color:#888;
}

/* Modal */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.55);
  align-items:center;
  justify-content:center;
  z-index:50;
  padding:15px;
}

.modal-box{
  background:white;
  width:100%;
  max-width:500px;
  border-radius:18px;
  padding:22px;
}

.modal-box h2{
  margin-bottom:18px;
}

input,select{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:10px;
  margin-bottom:12px;
  outline:none;
}

input:focus,select:focus{
  border-color:#16a34a;
}

.close{
  float:left;
  background:#eee;
}

.total{
  background:#f3f4f6;
  padding:15px;
  border-radius:10px;
  margin:10px 0;
  font-weight:bold;
}

@media(max-width:900px){
  .products{
    grid-template-columns:repeat(2,1fr);
  }

  .stats{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:550px){
  .products{
    grid-template-columns:1fr;
  }

  .stats{
    grid-template-columns:1fr 1fr;
  }

  header{
    padding:14px;
  }

  .container{
    padding:12px;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">🚀 Flash<span>Drop</span> Store</div>
  <button class="btn" onclick="openOrder()">＋ كوموند جديدة</button>
</header>

<div class="container">

  <!-- الإحصائيات -->

  <div class="stats">

    <div class="card">
      <div class="stat-title">📦 جميع الطلبات</div>
      <div class="stat-number" id="allOrders">0</div>
    </div>

    <div class="card">
      <div class="stat-title">🆕 الطلبات الجديدة</div>
      <div class="stat-number blue" id="newOrders">0</div>
    </div>

    <div class="card">
      <div class="stat-title">✅ تم التوصيل</div>
      <div class="stat-number green" id="doneOrders">0</div>
    </div>

    <div class="card">
      <div class="stat-title">💰 المداخيل</div>
      <div class="stat-number orange" id="revenue">0 DH</div>
    </div>

  </div>

  <!-- المنتجات -->

  <div class="section-title">
    <h2>🛍️ المنتجات</h2>
  </div>

  <div class="products" id="products"></div>

  <!-- الطلبات -->

  <div class="section-title">
    <h2>📦 الطلبات</h2>
    <button class="btn" onclick="openOrder()">＋ إضافة كوموند</button>
  </div>

  <div class="orders">

    <table>

      <thead>
        <tr>
          <th>#</th>
          <th>الزبون</th>
          <th>المدينة</th>
          <th>المنتج</th>
          <th>الثمن</th>
          <th>الحالة</th>
          <th>حذف</th>
        </tr>
      </thead>

      <tbody id="ordersTable"></tbody>

    </table>

  </div>

</div>


<!-- نافذة إضافة الطلب -->

<div class="modal" id="orderModal">

  <div class="modal-box">

    <button class="close" onclick="closeOrder()">✕</button>

    <h2>➕ إنشاء كوموند جديدة</h2>

    <input id="customerName" placeholder="اسم الزبون">

    <input id="phone" placeholder="رقم الهاتف" type="tel">

    <input id="city" placeholder="المدينة">

    <input id="address" placeholder="العنوان">

    <select id="productSelect" onchange="calculateTotal()">
      <option value="">اختار المنتج</option>
    </select>

    <input
      id="quantity"
      type="number"
      min="1"
      value="1"
      onchange="calculateTotal()"
    >

    <div class="total">
      المجموع: <span id="total">0</span> DH
    </div>

    <button class="btn" style="width:100%" onclick="addOrder()">
      تأكيد الكوموند
    </button>

  </div>

</div>


<script>

const products = [

 {
  id:1,
  name:"زيت ميلي الأصلي",
  price:50,
  old:79,
  image:"https://images.unsplash.com/photo-1608571423902-eed4a5ad8108"
 },

 {
  id:2,
  name:"مكبر صوت بلوتوث",
  price:100,
  old:149,
  image:"https://images.unsplash.com/photo-1608043152269-423dbba4e7e1"
 },

 {
  id:3,
  name:"حقيبة مكياج LED",
  price:135,
  old:189,
  image:"https://images.unsplash.com/photo-1596462502278-27bfdc403348"
 },

 {
  id:4,
  name:"مصباح طاولة",
  price:40,
  old:59,
  image:"https://images.unsplash.com/photo-1507473885765-e6ed057f782c"
 },

 {
  id:5,
  name:"وسادة مقعد مريحة",
  price:90,
  old:129,
  image:"https://images.unsplash.com/photo-1584100936595-c0654b55a2e2"
 },

 {
  id:6,
  name:"رف تجفيف الملابس",
  price:79,
  old:119,
  image:"https://images.unsplash.com/photo-1521656693074-0ef32e80a5d5"
 },

 {
  id:7,
  name:"مزيل الوبر",
  price:55,
  old:79,
  image:"https://images.unsplash.com/photo-1583947215259-38e31be8751f"
 },

 {
  id:8,
  name:"خلاط متعدد الوظائف",
  price:190,
  old:269,
  image:"https://images.unsplash.com/photo-1570222094114-d054a817e56b"
 }

];


let orders =
 JSON.parse(localStorage.getItem("flashdrop_orders")) || [];


/* عرض المنتجات */

function renderProducts(){

 const box = document.getElementById("products");

 box.innerHTML = "";

 products.forEach(p=>{

   box.innerHTML += `

    <div class="card product">

      <img src="${p.image}">

      <h3>${p.name}</h3>

      <div>
        <span class="price">${p.price} DH</span>
        <span class="old-price">${p.old} DH</span>
      </div>

      <button class="btn" onclick="openOrder(${p.id})">
        🛒 إنشاء كوموند
      </button>

    </div>

   `;

 });

}


/* فتح الطلب */

function openOrder(productId=""){

 document.getElementById("orderModal").style.display="flex";

 const select = document.getElementById("productSelect");

 select.innerHTML =
 `<option value="">اختار المنتج</option>`;

 products.forEach(p=>{

   select.innerHTML +=
   `<option value="${p.id}">
      ${p.name} - ${p.price} DH
   </option>`;

 });

 if(productId){
   select.value = productId;
 }

 calculateTotal();

}


/* إغلاق */

function closeOrder(){

 document.getElementById("orderModal").style.display="none";

}


/* الحساب */

function calculateTotal(){

 const id =
 document.getElementById("productSelect").value;

 const qty =
 Number(document.getElementById("quantity").value) || 1;

 const product =
 products.find(p=>p.id==id);

 document.getElementById("total").innerText =
 product ? product.price * qty : 0;

}


/* إضافة الطلب */

function addOrder(){

 const name =
 document.getElementById("customerName").value.trim();

 const phone =
 document.getElementById("phone").value.trim();

 const city =
 document.getElementById("city").value.trim();

 const address =
 document.getElementById("address").value.trim();

 const productId =
 document.getElementById("productSelect").value;

 const quantity =
 Number(document.getElementById("quantity").value) || 1;

 const product =
 products.find(p=>p.id==productId);


 if(!name || !phone || !city || !product){

   alert("⚠️ عافاك عمر المعلومات كاملة");

   return;
 }


 const order = {

   id:Date.now(),

   customer:name,

   phone:phone,

   city:city,

   address:address,

   product:product.name,

   price:product.price,

   quantity:quantity,

   total:product.price * quantity,

   status:"new",

   date:new Date().toLocaleString("ar-MA")

 };


 orders.unshift(order);

 saveOrders();

 closeOrder();

 clearForm();

 renderOrders();

 updateStats();

 alert("✅ تم إنشاء الكوموند بنجاح");

}


/* حفظ */

function saveOrders(){

 localStorage.setItem(
   "flashdrop_orders",
   JSON.stringify(orders)
 );

}


/* عرض الطلبات */

function renderOrders(){

 const table =
 document.getElementById("ordersTable");

 if(orders.length===0){

   table.innerHTML =
   `<tr>
      <td colspan="7" class="empty">
        ماكايناش الطلبات دابا
      </td>
    </tr>`;

   return;

 }


 table.innerHTML = "";

 orders.forEach((o,index)=>{

   let statusText =
   o.status==="new"
   ? "جديدة"
   : o.status==="done"
   ? "تم التوصيل"
   : "ملغاة";


   table.innerHTML += `

   <tr>

     <td>${index+1}</td>

     <td>${o.customer}</td>

     <td>${o.city}</td>

     <td>${o.product} × ${o.quantity}</td>

     <td>${o.total} DH</td>

     <td>

       <select onchange="changeStatus(${o.id},this.value)">

         <option value="new"
         ${o.status==="new"?"selected":""}>
         جديدة
         </option>

         <option value="done"
         ${o.status==="done"?"selected":""}>
         تم التوصيل
         </option>

         <option value="cancel"
         ${o.status==="cancel"?"selected":""}>
         ملغاة
         </option>

       </select>

     </td>

     <td>

       <button
       class="btn-danger"
       onclick="deleteOrder(${o.id})">
       حذف
       </button>

     </td>

   </tr>

   `;

 });

}


/* تغيير الحالة */

function changeStatus(id,status){

 const order =
 orders.find(o=>o.id===id);

 if(order){

   order.status=status;

   saveOrders();

   renderOrders();

   updateStats();

 }

}


/* حذف */

function deleteOrder(id){

 if(!confirm("واش متأكد باغي تحذف هاد الكوموند؟"))
 return;

 orders =
 orders.filter(o=>o.id!==id);

 saveOrders();

 renderOrders();

 updateStats();

}


/* الإحصائيات */

function updateStats(){

 document.getElementById("allOrders")
 .innerText=orders.length;


 document.getElementById("newOrders")
 .innerText=
 orders.filter(o=>o.status==="new").length;


 document.getElementById("doneOrders")
 .innerText=
 orders.filter(o=>o.status==="done").length;


 const revenue =
 orders
 .filter(o=>o.status==="done")
 .reduce((sum,o)=>sum+o.total,0);


 document.getElementById("revenue")
 .innerText=revenue+" DH";

}


/* تنظيف الفورم */

function clearForm(){

 document.getElementById("customerName").value="";

 document.getElementById("phone").value="";

 document.getElementById("city").value="";

 document.getElementById("address").value="";

 document.getElementById("productSelect").value="";

 document.getElementById("quantity").value=1;

 document.getElementById("total").innerText=0;

}


/* البداية */

renderProducts();

renderOrders();

updateStats();

</script>

</body>
</html>
