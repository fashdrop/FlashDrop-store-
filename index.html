<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlashDrop Store</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f4f6fb;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 18px;
    }

    .container {
      width: 100%;
      max-width: 430px;
      background: white;
      border-radius: 24px;
      padding: 28px 22px;
      box-shadow: 0 12px 40px rgba(0,0,0,.08);
    }

    .logo {
      text-align: center;
      font-size: 29px;
      font-weight: bold;
      color: #111827;
      margin-bottom: 6px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .tabs button {
      flex: 1;
      border: 0;
      padding: 13px 8px;
      border-radius: 13px;
      background: #edf0f4;
      cursor: pointer;
      font-size: 14px;
    }

    .tabs button.active {
      background: #111827;
      color: white;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid #ddd;
      border-radius: 13px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #111827;
    }

    .main-btn {
      width: 100%;
      border: 0;
      border-radius: 13px;
      padding: 14px;
      background: #111827;
      color: white;
      font-size: 16px;
      cursor: pointer;
      margin-top: 4px;
    }

    .main-btn:disabled {
      opacity: .6;
    }

    .link-btn {
      width: 100%;
      border: 0;
      background: transparent;
      color: #2563eb;
      padding: 14px 5px 4px;
      cursor: pointer;
      font-size: 14px;
    }

    .message {
      text-align: center;
      min-height: 22px;
      margin-top: 15px;
      font-size: 14px;
    }

    .success {
      color: #16803c;
    }

    .error {
      color: #d93025;
    }

    .hidden {
      display: none;
    }

    .back {
      margin-bottom: 15px;
      border: 0;
      background: #f1f3f5;
      padding: 9px 13px;
      border-radius: 10px;
      cursor: pointer;
    }

    h3 {
      margin-top: 0;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="logo">🚀 FlashDrop Store</div>
  <div class="subtitle">مرحبا بك في منصة FlashDrop</div>

  <!-- TABS -->
  <div class="tabs" id="tabs">

    <button id="loginTab"
            class="active"
            onclick="showLogin()">
      تسجيل الدخول
    </button>

    <button id="signupTab"
            onclick="showSignup()">
      إنشاء حساب
    </button>

  </div>


  <!-- LOGIN -->
  <div id="loginForm">

    <input
      id="loginEmail"
      type="email"
      placeholder="البريد الإلكتروني"
      autocomplete="email"
    >

    <input
      id="loginPassword"
      type="password"
      placeholder="كلمة المرور"
      autocomplete="current-password"
    >

    <button class="main-btn" onclick="login()">
      دخول
    </button>

    <button class="link-btn" onclick="showForgot()">
      نسيت كلمة المرور؟
    </button>

  </div>


  <!-- SIGNUP -->
  <div id="signupForm" class="hidden">

    <input
      id="signupName"
      type="text"
      placeholder="الاسم الكامل"
    >

    <input
      id="signupPhone"
      type="tel"
      placeholder="رقم الهاتف"
    >

    <input
      id="signupEmail"
      type="email"
      placeholder="البريد الإلكتروني"
    >

    <input
      id="signupPassword"
      type="password"
      placeholder="كلمة المرور"
      autocomplete="new-password"
    >

    <button class="main-btn" onclick="signup()">
      إنشاء الحساب
    </button>

  </div>


  <!-- FORGOT PASSWORD -->
  <div id="forgotForm" class="hidden">

    <button class="back" onclick="showLogin()">
      ← رجوع
    </button>

    <h3>استرجاع كلمة المرور</h3>

    <input
      id="forgotEmail"
      type="email"
      placeholder="البريد الإلكتروني"
    >

    <button class="main-btn" onclick="sendResetEmail()">
      إرسال رابط الاسترجاع
    </button>

  </div>


  <!-- RESET PASSWORD -->
  <div id="resetForm" class="hidden">

    <h3>تغيير كلمة المرور</h3>

    <input
      id="newPassword"
      type="password"
      placeholder="كلمة المرور الجديدة"
      autocomplete="new-password"
    >

    <input
      id="newPassword2"
      type="password"
      placeholder="أعد كتابة كلمة المرور"
      autocomplete="new-password"
    >

    <button class="main-btn" onclick="updatePassword()">
      تغيير كلمة المرور
    </button>

  </div>


  <div id="message" class="message"></div>

</div>


<script>

  /* =========================================
     SUPABASE
  ========================================= */

  const SUPABASE_URL =
    "https://vadiyawqpbtdvnqmxxne.supabase.co";

  /*
    مهم:
    حط هنا Publishable key / anon key فقط.
    ممنوع تحط service_role.
  */

  const SUPABASE_KEY =
    "YOUR_SUPABASE_ANON_KEY";


  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  /* =========================================
     ELEMENTS
  ========================================= */

  const loginForm =
    document.getElementById("loginForm");

  const signupForm =
    document.getElementById("signupForm");

  const forgotForm =
    document.getElementById("forgotForm");

  const resetForm =
    document.getElementById("resetForm");

  const tabs =
    document.getElementById("tabs");


  /* =========================================
     SHOW LOGIN
  ========================================= */

  function showLogin() {

    loginForm.classList.remove("hidden");

    signupForm.classList.add("hidden");

    forgotForm.classList.add("hidden");

    resetForm.classList.add("hidden");

    tabs.classList.remove("hidden");

    document
      .getElementById("loginTab")
      .classList.add("active");

    document
      .getElementById("signupTab")
      .classList.remove("active");

    clearMessage();
  }


  /* =========================================
     SHOW SIGNUP
  ========================================= */

  function showSignup() {

    loginForm.classList.add("hidden");

    signupForm.classList.remove("hidden");

    forgotForm.classList.add("hidden");

    resetForm.classList.add("hidden");

    tabs.classList.remove("hidden");

    document
      .getElementById("signupTab")
      .classList.add("active");

    document
      .getElementById("loginTab")
      .classList.remove("active");

    clearMessage();
  }


  /* =========================================
     SHOW FORGOT
  ========================================= */

  function showForgot() {

    loginForm.classList.add("hidden");

    signupForm.classList.add("hidden");

    forgotForm.classList.remove("hidden");

    resetForm.classList.add("hidden");

    tabs.classList.add("hidden");

    clearMessage();
  }


  /* =========================================
     SIGN UP
  ========================================= */

  async function signup() {

    const name =
      document.getElementById("signupName")
      .value.trim();

    const phone =
      document.getElementById("signupPhone")
      .value.trim();

    const email =
      document.getElementById("signupEmail")
      .value.trim();

    const password =
      document.getElementById("signupPassword")
      .value;


    if (!name || !phone || !email || !password) {

      showMessage(
        "عمر جميع المعلومات",
        "error"
      );

      return;
    }


    if (password.length < 6) {

      showMessage(
        "كلمة المرور خاصها تكون 6 أحرف على الأقل",
        "error"
      );

      return;
    }


    showMessage(
      "جاري إنشاء الحساب...",
      ""
    );


    const { data, error } =
      await supabaseClient.auth.signUp({

        email: email,

        password: password,

        options: {

          emailRedirectTo:
            window.location.origin +
            window.location.pathname,

          data: {

            full_name: name,

            phone: phone

          }

        }

      });


    if (error) {

      showMessage(
        error.message,
        "error"
      );

      return;
    }


    showMessage(
      "تم إنشاء الحساب بنجاح ✅",
      "success"
    );


    document.getElementById("signupName").value = "";
    document.getElementById("signupPhone").value = "";
    document.getElementById("signupEmail").value = "";
    document.getElementById("signupPassword").value = "";

  }


  /* =========================================
     LOGIN
  ========================================= */

  async function login() {

    const email =
      document.getElementById("loginEmail")
      .value.trim();

    const password =
      document.getElementById("loginPassword")
      .value;


    if (!email || !password) {

      showMessage(
        "دخل الإيميل وكلمة المرور",
        "error"
      );

      return;
    }


    showMessage(
      "جاري تسجيل الدخول...",
      ""
    );


    const { data, error } =
      await supabaseClient.auth
      .signInWithPassword({

        email: email,

        password: password

      });


    if (error) {

      showMessage(
        error.message,
        "error"
      );

      return;
    }


    showMessage(
      "مرحبا بك 👋 تم تسجيل الدخول بنجاح",
      "success"
    );


    /*
      المرحلة القادمة:
      غادي نجيب role ديال المستخدم
      ونوجه Admin للوحة التحكم
      والمستخدم للمنصة.
    */

  }


  /* =========================================
     SEND PASSWORD RESET
  ========================================= */

  async function sendResetEmail() {

    const email =
      document.getElementById("forgotEmail")
      .value.trim();


    if (!email) {

      showMessage(
        "دخل البريد الإلكتروني",
        "error"
      );

      return;
    }


    showMessage(
      "جاري إرسال الرابط...",
      ""
    );


    const redirectTo =
      window.location.origin +
      window.location.pathname;


    const { error } =
      await supabaseClient.auth
      .resetPasswordForEmail(

        email,

        {
          redirectTo: redirectTo
        }

      );


    if (error) {

      showMessage(
        error.message,
        "error"
      );

      return;
    }


    showMessage(
      "تم إرسال رابط الاسترجاع إلى بريدك الإلكتروني 📩",
      "success"
    );

  }


  /* =========================================
     PASSWORD RECOVERY
  ========================================= */

  supabaseClient.auth
    .onAuthStateChange(
      async (event, session) => {

        if (event === "PASSWORD_RECOVERY") {

          loginForm.classList.add("hidden");

          signupForm.classList.add("hidden");

          forgotForm.classList.add("hidden");

          resetForm.classList.remove("hidden");

          tabs.classList.add("hidden");

          clearMessage();

        }

      }
    );


  /* =========================================
     UPDATE PASSWORD
  ========================================= */

  async function updatePassword() {

    const password =
      document.getElementById("newPassword")
      .value;

    const password2 =
      document.getElementById("newPassword2")
      .value;


    if (!password || !password2) {

      showMessage(
        "دخل كلمة المرور الجديدة",
        "error"
      );

      return;
    }


    if (password.length < 6) {

      showMessage(
        "كلمة المرور خاصها تكون 6 أحرف على الأقل",
        "error"
      );

      return;
    }


    if (password !== password2) {

      showMessage(
        "كلمتا المرور غير متطابقتين",
        "error"
      );

      return;
    }


    showMessage(
      "جاري تغيير كلمة المرور...",
      ""
    );


    const { error } =
      await supabaseClient.auth
      .updateUser({

        password: password

      });


    if (error) {

      showMessage(
        error.message,
        "error"
      );

      return;
    }


    showMessage(
      "تم تغيير كلمة المرور بنجاح ✅",
      "success"
    );


    document.getElementById("newPassword").value = "";
    document.getElementById("newPassword2").value = "";


    setTimeout(() => {

      showLogin();

    }, 1500);

  }


  /* =========================================
     MESSAGE
  ========================================= */

  function showMessage(text, type) {

    const box =
      document.getElementById("message");

    box.textContent = text;

    box.className =
      "message " + type;

  }


  function clearMessage() {

    showMessage("", "");

  }


  /* =========================================
     CHECK RECOVERY URL
  ========================================= */

  async function checkRecovery() {

    const hash =
      window.location.hash;

    if (
      hash &&
      hash.includes("access_token") &&
      hash.includes("type=recovery")
    ) {

      /*
        Supabase will trigger
        PASSWORD_RECOVERY
        automatically.
      */

    }

  }


  checkRecovery();

</script>

</body>
</html>
