<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlashDrop Store</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f5f7fb;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 22px;
      padding: 28px;
      box-shadow: 0 10px 35px rgba(0,0,0,.08);
    }

    .logo {
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .tabs button {
      flex: 1;
      padding: 12px;
      border: 0;
      border-radius: 12px;
      background: #eee;
      cursor: pointer;
      font-size: 15px;
    }

    .tabs button.active {
      background: #111827;
      color: white;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid #ddd;
      border-radius: 12px;
      outline: none;
      font-size: 15px;
    }

    input:focus {
      border-color: #111827;
    }

    .main-btn {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: #111827;
      color: white;
      font-size: 16px;
      cursor: pointer;
      margin-top: 5px;
    }

    .main-btn:disabled {
      opacity: .6;
    }

    .message {
      text-align: center;
      margin-top: 15px;
      font-size: 14px;
      min-height: 20px;
    }

    .success {
      color: #16803c;
    }

    .error {
      color: #d93025;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="logo">🚀 FlashDrop Store</div>
  <div class="subtitle">مرحبا بك في منصة FlashDrop</div>

  <div class="tabs">
    <button id="loginTab" class="active" onclick="showLogin()">
      تسجيل الدخول
    </button>

    <button id="signupTab" onclick="showSignup()">
      إنشاء حساب
    </button>
  </div>

  <!-- LOGIN -->
  <div id="loginForm">

    <input
      id="loginEmail"
      type="email"
      placeholder="البريد الإلكتروني"
    >

    <input
      id="loginPassword"
      type="password"
      placeholder="كلمة المرور"
    >

    <button class="main-btn" onclick="login()">
      دخول
    </button>

  </div>

  <!-- SIGNUP -->
  <div id="signupForm" class="hidden">

    <input
      id="signupName"
      type="text"
      placeholder="الاسم الكامل"
    >

    <input
      id="signupPhone"
      type="tel"
      placeholder="رقم الهاتف"
    >

    <input
      id="signupEmail"
      type="email"
      placeholder="البريد الإلكتروني"
    >

    <input
      id="signupPassword"
      type="password"
      placeholder="كلمة المرور"
    >

    <button class="main-btn" onclick="signup()">
      إنشاء الحساب
    </button>

  </div>

  <div id="message" class="message"></div>

</div>

<script>

  // ==========================================
  // SUPABASE
  // ==========================================

  const SUPABASE_URL =
    "https://vadiyawqpbtdvnqmxxne.supabase.co";

  const SUPABASE_KEY =
    "YOUR_SUPABASE_ANON_KEY";

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // ==========================================
  // TABS
  // ==========================================

  function showLogin() {

    document
      .getElementById("loginForm")
      .classList.remove("hidden");

    document
      .getElementById("signupForm")
      .classList.add("hidden");

    document
      .getElementById("loginTab")
      .classList.add("active");

    document
      .getElementById("signupTab")
      .classList.remove("active");

    clearMessage();
  }


  function showSignup() {

    document
      .getElementById("signupForm")
      .classList.remove("hidden");

    document
      .getElementById("loginForm")
      .classList.add("hidden");

    document
      .getElementById("signupTab")
      .classList.add("active");

    document
      .getElementById("loginTab")
      .classList.remove("active");

    clearMessage();
  }


  // ==========================================
  // SIGN UP
  // ==========================================

  async function signup() {

    const name =
      document.getElementById("signupName").value.trim();

    const phone =
      document.getElementById("signupPhone").value.trim();

    const email =
      document.getElementById("signupEmail").value.trim();

    const password =
      document.getElementById("signupPassword").value;

    if (!name || !phone || !email || !password) {

      showMessage(
        "عمر جميع المعلومات",
        "error"
      );

      return;
    }

    if (password.length < 6) {

      showMessage(
        "كلمة المرور خاصها تكون 6 أحرف على الأقل",
        "error"
      );

      return;
    }

    showMessage(
      "جاري إنشاء الحساب...",
      ""
    );

    const { data, error } =
      await supabaseClient.auth.signUp({

        email: email,

        password: password,

        options: {

          data: {
            full_name: name,
            phone: phone
          }

        }

      });


    if (error) {

      showMessage(
        error.message,
        "error"
      );

      return;
    }


    showMessage(
      "تم إنشاء الحساب بنجاح ✅",
      "success"
    );

    document.getElementById("signupName").value = "";
    document.getElementById("signupPhone").value = "";
    document.getElementById("signupEmail").value = "";
    document.getElementById("signupPassword").value = "";

  }


  // ==========================================
  // LOGIN
  // ==========================================

  async function login() {

    const email =
      document.getElementById("loginEmail").value.trim();

    const password =
      document.getElementById("loginPassword").value;


    if (!email || !password) {

      showMessage(
        "دخل الإيميل وكلمة المرور",
        "error"
      );

      return;
    }


    showMessage(
      "جاري تسجيل الدخول...",
      ""
    );


    const { data, error } =
      await supabaseClient.auth.signInWithPassword({

        email: email,

        password: password

      });


    if (error) {

      showMessage(
        error.message,
        "error"
      );

      return;
    }


    showMessage(
      "مرحبا بك 👋 تم تسجيل الدخول بنجاح",
      "success"
    );

    /*
      المرحلة القادمة:
      غادي نوجهو المستخدم للواجهة ديالو
      وAdmin للوحة التحكم.
    */

  }


  // ==========================================
  // MESSAGE
  // ==========================================

  function showMessage(text, type) {

    const box =
      document.getElementById("message");

    box.textContent = text;

    box.className =
      "message " + type;

  }


  function clearMessage() {

    showMessage("", "");

  }

</script>

</body>
</html>
