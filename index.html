<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>FlashDrop Store</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #f4f6f8;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 430px;
      padding: 20px;
    }

    .card {
      background: white;
      border-radius: 20px;
      padding: 25px;
      box-shadow: 0 8px 30px rgba(0,0,0,.08);
    }

    .logo {
      text-align: center;
      font-size: 30px;
      font-weight: bold;
      color: #111827;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 25px;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #111827;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: #111827;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    button:hover {
      opacity: .9;
    }

    .secondary {
      background: #e5e7eb;
      color: #111827;
    }

    .link {
      display: block;
      text-align: center;
      margin-top: 15px;
      color: #2563eb;
      cursor: pointer;
      font-size: 14px;
    }

    .message {
      text-align: center;
      margin-top: 15px;
      padding: 10px;
      border-radius: 10px;
      display: none;
    }

    .success {
      display: block;
      background: #dcfce7;
      color: #166534;
    }

    .error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card">

    <div class="logo">🚀 FlashDrop Store</div>
    <div class="subtitle">منصة التجارة الإلكترونية</div>

    <!-- LOGIN -->
    <div id="loginBox">

      <h2>تسجيل الدخول</h2>

      <input
        type="email"
        id="loginEmail"
        placeholder="البريد الإلكتروني"
      >

      <input
        type="password"
        id="loginPassword"
        placeholder="كلمة المرور"
      >

      <button onclick="login()">
        دخول
      </button>

      <span class="link" onclick="showSignup()">
        إنشاء حساب جديد
      </span>

      <span class="link" onclick="showForgot()">
        نسيت كلمة المرور؟
      </span>

    </div>


    <!-- SIGNUP -->
    <div id="signupBox" class="hidden">

      <h2>إنشاء حساب</h2>

      <input
        type="text"
        id="signupName"
        placeholder="الاسم الكامل"
      >

      <input
        type="tel"
        id="signupPhone"
        placeholder="رقم الهاتف"
      >

      <input
        type="email"
        id="signupEmail"
        placeholder="البريد الإلكتروني"
      >

      <input
        type="password"
        id="signupPassword"
        placeholder="كلمة المرور"
      >

      <button onclick="signup()">
        إنشاء الحساب
      </button>

      <span class="link" onclick="showLogin()">
        عندي حساب بالفعل
      </span>

    </div>


    <!-- FORGOT PASSWORD -->
    <div id="forgotBox" class="hidden">

      <h2>نسيت كلمة المرور</h2>

      <input
        type="email"
        id="forgotEmail"
        placeholder="البريد الإلكتروني"
      >

      <button onclick="sendResetEmail()">
        إرسال رابط الاسترجاع
      </button>

      <span class="link" onclick="showLogin()">
        الرجوع لتسجيل الدخول
      </span>

    </div>


    <!-- RESET PASSWORD -->
    <div id="resetBox" class="hidden">

      <h2>تغيير كلمة المرور</h2>

      <input
        type="password"
        id="newPassword"
        placeholder="كلمة المرور الجديدة"
      >

      <input
        type="password"
        id="confirmPassword"
        placeholder="تأكيد كلمة المرور"
      >

      <button onclick="resetPassword()">
        تغيير كلمة المرور
      </button>

    </div>


    <div id="message" class="message"></div>

  </div>

</div>


<script>

  // =========================
  // SUPABASE
  // =========================

  const SUPABASE_URL =
    "https://vadiyawqpbtdvnqmxxne.supabase.co";

  const SUPABASE_KEY =
    "sb_publishable_MKv1kVwoBi6oEcrPIZMVMQ_Qk59pLSW";

  const SITE_URL =
    "https://fashdrop.github.io/FlashDrop-store-/";

  const supabaseClient =
    window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_KEY
    );


  // =========================
  // ELEMENTS
  // =========================

  const loginBox =
    document.getElementById("loginBox");

  const signupBox =
    document.getElementById("signupBox");

  const forgotBox =
    document.getElementById("forgotBox");

  const resetBox =
    document.getElementById("resetBox");

  const message =
    document.getElementById("message");


  // =========================
  // MESSAGE
  // =========================

  function showMessage(text, type = "success") {

    message.textContent = text;

    message.className =
      "message " + type;

  }


  // =========================
  // SHOW / HIDE
  // =========================

  function hideAll() {

    loginBox.classList.add("hidden");
    signupBox.classList.add("hidden");
    forgotBox.classList.add("hidden");
    resetBox.classList.add("hidden");

    message.className = "message";
    message.textContent = "";

  }


  function showLogin() {

    hideAll();

    loginBox.classList.remove("hidden");

  }


  function showSignup() {

    hideAll();

    signupBox.classList.remove("hidden");

  }


  function showForgot() {

    hideAll();

    forgotBox.classList.remove("hidden");

  }


  function showReset() {

    hideAll();

    resetBox.classList.remove("hidden");

  }


  // =========================
  // SIGNUP
  // =========================

  async function signup() {

    const name =
      document.getElementById("signupName").value.trim();

    const phone =
      document.getElementById("signupPhone").value.trim();

    const email =
      document.getElementById("signupEmail").value.trim();

    const password =
      document.getElementById("signupPassword").value;

    if (!name || !email || !password) {

      showMessage(
        "عمر جميع المعلومات المطلوبة",
        "error"
      );

      return;
    }

    if (password.length < 6) {

      showMessage(
        "كلمة المرور خاصها تكون 6 حروف على الأقل",
        "error"
      );

      return;
    }


    const { data, error } =
      await supabaseClient.auth.signUp({

        email: email,

        password: password,

        options: {

          emailRedirectTo: SITE_URL,

          data: {

            full_name: name,

            phone: phone

          }

        }

      });


    if (error) {

      showMessage(
        error.message,
        "error"
      );

      return;
    }


    showMessage(
      "تم إنشاء الحساب بنجاح ✅ تحقق من البريد الإلكتروني إذا طلب منك ذلك."
    );

  }


  // =========================
  // LOGIN
  // =========================

  async function login() {

    const email =
      document.getElementById("loginEmail").value.trim();

    const password =
      document.getElementById("loginPassword").value;


    if (!email || !password) {

      showMessage(
        "دخل البريد الإلكتروني وكلمة المرور",
        "error"
      );

      return;
    }


    const { data, error } =
      await supabaseClient.auth.signInWithPassword({

        email: email,

        password: password

      });


    if (error) {

      showMessage(
        "البريد الإلكتروني أو كلمة المرور غير صحيحة",
        "error"
      );

      return;
    }


    showMessage(
      "تم تسجيل الدخول بنجاح ✅"
    );


    // من بعد غادي نربطو هنا Dashboard
    setTimeout(() => {

      window.location.href = SITE_URL;

    }, 1000);

  }


  // =========================
  // SEND RESET EMAIL
  // =========================

  async function sendResetEmail() {

    const email =
      document.getElementById("forgotEmail").value.trim();


    if (!email) {

      showMessage(
        "دخل البريد الإلكتروني",
        "error"
      );

      return;
    }


    const { error } =
      await supabaseClient.auth.resetPasswordForEmail(

        email,

        {
          redirectTo: SITE_URL
        }

      );


    if (error) {

      showMessage(
        error.message,
        "error"
      );

      return;
    }


    showMessage(
      "تم إرسال رابط تغيير كلمة المرور إلى بريدك الإلكتروني ✅"
    );

  }


  // =========================
  // RESET PASSWORD
  // =========================

  async function resetPassword() {

    const password =
      document.getElementById("newPassword").value;

    const confirmPassword =
      document.getElementById("confirmPassword").value;


    if (!password || !confirmPassword) {

      showMessage(
        "دخل كلمة المرور الجديدة",
        "error"
      );

      return;
    }


    if (password.length < 6) {

      showMessage(
        "كلمة المرور خاصها تكون 6 حروف على الأقل",
        "error"
      );

      return;
    }


    if (password !== confirmPassword) {

      showMessage(
        "كلمات المرور غير متطابقة",
        "error"
      );

      return;
    }


    const { error } =
      await supabaseClient.auth.updateUser({

        password: password

      });


    if (error) {

      showMessage(
        error.message,
        "error"
      );

      return;
    }


    showMessage(
      "تم تغيير كلمة المرور بنجاح ✅"
    );


    setTimeout(() => {

      showLogin();

    }, 1500);

  }


  // =========================
  // PASSWORD RECOVERY
  // =========================

  supabaseClient.auth.onAuthStateChange(

    async (event, session) => {

      if (event === "PASSWORD_RECOVERY") {

        showReset();

      }

    }

  );


  // =========================
  // CHECK SESSION
  // =========================

  async function checkSession() {

    const { data } =
      await supabaseClient.auth.getSession();


    if (data && data.session) {

      // المستخدم مسجل الدخول
      // من بعد نوجهوه للوحة المناسبة

    }

  }


  checkSession();

</script>

</body>
</html>
