<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlashDrop Store</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,Tahoma,sans-serif;
  background:#f5f7fb;
  color:#172033;
}

header{
  background:linear-gradient(135deg,#0b8f57,#087443);
  color:white;
  padding:18px;
  position:sticky;
  top:0;
  z-index:10;
}

.head{
  max-width:1100px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.logo{
  font-size:23px;
  font-weight:bold;
}

.call{
  background:white;
  color:#087443;
  padding:10px 14px;
  border-radius:10px;
  text-decoration:none;
  font-weight:bold;
}

.hero{
  max-width:1100px;
  margin:20px auto;
  padding:35px 20px;
  border-radius:25px;
  background:linear-gradient(135deg,#e9fff4,#ffffff);
  text-align:center;
}

.hero h1{
  margin:0 0 10px;
  font-size:34px;
}

.hero p{
  color:#667085;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:0 15px 40px;
}

.products{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.product{
  background:white;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 5px 22px #0000000c;
}

.product img{
  width:100%;
  height:230px;
  object-fit:cover;
  background:#eee;
}

.body{
  padding:16px;
}

.name{
  font-size:19px;
  font-weight:bold;
  margin-bottom:8px;
}

.desc{
  color:#667085;
  font-size:14px;
  min-height:40px;
}

.prices{
  margin:12px 0;
}

.price{
  color:#0b8f57;
  font-size:23px;
  font-weight:bold;
}

.old{
  color:#999;
  text-decoration:line-through;
  margin-right:8px;
}

.discount{
  display:inline-block;
  background:#ef4444;
  color:white;
  padding:5px 8px;
  border-radius:7px;
  font-size:12px;
  margin-top:6px;
}

.buy{
  width:100%;
  padding:13px;
  border:0;
  border-radius:11px;
  background:#0b9f5b;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.empty{
  background:white;
  padding:40px;
  text-align:center;
  border-radius:18px;
  color:#777;
}

/* MODAL */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#0008;
  z-index:100;
  padding:15px;
  align-items:center;
  justify-content:center;
}

.modal.show{
  display:flex;
}

.box{
  width:100%;
  max-width:500px;
  max-height:92vh;
  overflow:auto;
  background:white;
  border-radius:20px;
  padding:22px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.close{
  width:38px;
  height:38px;
  border:0;
  border-radius:50%;
  background:#eee;
  font-size:20px;
}

label{
  display:block;
  font-weight:bold;
  margin-top:12px;
}

input,select,textarea{
  width:100%;
  padding:13px;
  margin-top:6px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:15px;
}

textarea{
  min-height:80px;
}

.total{
  background:#f0fff7;
  padding:15px;
  border-radius:12px;
  margin-top:15px;
  font-size:18px;
  font-weight:bold;
}

.confirm{
  width:100%;
  margin-top:15px;
  padding:14px;
  border:0;
  border-radius:12px;
  background:#0b8f57;
  color:white;
  font-size:16px;
  font-weight:bold;
}

.message{
  text-align:center;
  margin-top:12px;
  font-weight:bold;
}

@media(max-width:800px){
  .products{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:550px){
  .head{
    flex-direction:column;
  }

  .products{
    grid-template-columns:1fr;
  }

  .hero h1{
    font-size:27px;
  }
}
</style>
</head>

<body>

<header>
  <div class="head">
    <div class="logo">🚀 FlashDrop Store</div>

    <a class="call" href="tel:0712570921">
      ☎️ 0712570921
    </a>
  </div>
</header>

<section class="hero">
  <h1>مرحبا بكم في FlashDrop 🛍️</h1>
  <p>منتجات مختارة بأثمنة مناسبة وتخفيضات مميزة</p>
</section>

<main class="container">

  <div id="products" class="products">
    <div class="empty">⏳ جاري تحميل المنتجات...</div>
  </div>

</main>

<!-- ORDER MODAL -->

<div id="modal" class="modal">

  <div class="box">

    <div class="top">
      <h2>🛒 تأكيد الطلب</h2>
      <button class="close" onclick="closeOrder()">×</button>
    </div>

    <h3 id="selectedProduct"></h3>

    <label>الاسم الكامل</label>
    <input id="customerName" placeholder="مثال: محمد">

    <label>رقم الهاتف</label>
    <input id="phone" type="tel" placeholder="06XXXXXXXX">

    <label>المدينة</label>
    <input id="city" placeholder="مثال: الدار البيضاء">

    <label>العنوان</label>
    <textarea id="address" placeholder="العنوان بالتفصيل"></textarea>

    <label>الكمية</label>
    <input id="quantity" type="number" min="1" value="1"
           oninput="updateTotal()">

    <div id="total" class="total">
      المجموع: 0 DH
    </div>

    <button class="confirm" onclick="sendOrder()">
      ✅ تأكيد الطلب
    </button>

    <div id="message" class="message"></div>

  </div>

</div>

<script>

const SUPABASE_URL =
"https://vadiyawqpbtdvnqmxxne.supabase.co";

const SUPABASE_KEY =
"sb_publishable_MKv1kVwoBi6oEcrPIZMVMQ_Qk59pLSW";

const db =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let selectedProduct = null;


// ========================
// LOAD PRODUCTS
// ========================

async function loadProducts(){

  const box =
    document.getElementById("products");

  const {data,error} =
    await db
      .from("products")
      .select("*")
      .eq("active",true)
      .gt("stock",0)
      .order("id",{ascending:false});

  if(error){

    box.innerHTML =
      `<div class="empty">
        وقع مشكل فتحميل المنتجات
      </div>`;

    console.error(error);

    return;
  }

  if(!data || data.length===0){

    box.innerHTML =
      `<div class="empty">
        ما كايناش منتجات دابا
      </div>`;

    return;
  }

  box.innerHTML = "";

  data.forEach(p=>{

    const price =
      Number(p.selling_price || 0);

    const old =
      Number(p.old_price || 0);

    let discount = "";

    if(old > price){

      const percent =
        Math.round(
          ((old-price)/old)*100
        );

      discount =
        `<span class="discount">
          تخفيض ${percent}%
        </span>`;
    }

    box.innerHTML += `

      <article class="product">

        <img
          src="${escapeHtml(
            p.image_url ||
            "https://placehold.co/600x450?text=FlashDrop"
          )}"
          onerror="this.src='https://placehold.co/600x450?text=FlashDrop'"
        >

        <div class="body">

          <div class="name">
            ${escapeHtml(p.name)}
          </div>

          <div class="desc">
            ${escapeHtml(p.description || "")}
          </div>

          <div class="prices">

            <span class="price">
              ${price.toFixed(2)} DH
            </span>

            ${
              old > price
              ? `<span class="old">
                   ${old.toFixed(2)} DH
                 </span>`
              : ""
            }

            <br>

            ${discount}

          </div>

          <button
            class="buy"
            onclick='openOrder(${JSON.stringify(p)})'
          >
            🛒 اطلب الآن
          </button>

        </div>

      </article>
    `;
  });
}


// ========================
// OPEN ORDER
// ========================

function openOrder(product){

  selectedProduct = product;

  document.getElementById("selectedProduct")
    .textContent =
      product.name;

  document.getElementById("quantity")
    .value = 1;

  document.getElementById("message")
    .textContent = "";

  updateTotal();

  document.getElementById("modal")
    .classList.add("show");
}


// ========================
// CLOSE
// ========================

function closeOrder(){

  document.getElementById("modal")
    .classList.remove("show");

}


// ========================
// TOTAL
// ========================

function updateTotal(){

  if(!selectedProduct) return;

  const quantity =
    Math.max(
      1,
      Number(
        document.getElementById("quantity").value
      ) || 1
    );

  const total =
    Number(selectedProduct.selling_price || 0)
    * quantity;

  document.getElementById("total")
    .textContent =
      "المجموع: " +
      total.toFixed(2) +
      " DH";
}


// ========================
// SEND ORDER
// ========================

async function sendOrder(){

  if(!selectedProduct) return;

  const name =
    document.getElementById("customerName")
      .value.trim();

  const phone =
    document.getElementById("phone")
      .value.trim();

  const city =
    document.getElementById("city")
      .value.trim();

  const address =
    document.getElementById("address")
      .value.trim();

  const quantity =
    Math.max(
      1,
      Number(
        document.getElementById("quantity").value
      ) || 1
    );

  const message =
    document.getElementById("message");


  if(!name ||
     !phone ||
     !city ||
     !address){

    message.style.color="#dc2626";

    message.textContent =
      "⚠️ عافاك عمر جميع المعلومات";

    return;
  }


  if(quantity > Number(selectedProduct.stock || 0)){

    message.style.color="#dc2626";

    message.textContent =
      "⚠️ الكمية المطلوبة ما كايناش فالمخزون";

    return;
  }


  const total =
    Number(selectedProduct.selling_price || 0)
    * quantity;


  const {error} =
    await db
      .from("orders")
      .insert({

        customer_name:name,

        phone:phone,

        city:city,

        address:address,

        product_id:selectedProduct.id,

        quantity:quantity,

        unit_price:
          Number(selectedProduct.selling_price),

        total:total,

        status:"new"

      });


  if(error){

    console.error(error);

    message.style.color="#dc2626";

    message.textContent =
      "❌ وقع مشكل، عاود المحاولة";

    return;
  }


  message.style.color="#0b8f57";

  message.textContent =
    "✅ تسجل الطلب ديالك بنجاح! غادي نتاصلو بك للتأكيد.";

  document.getElementById("customerName").value="";
  document.getElementById("phone").value="";
  document.getElementById("city").value="";
  document.getElementById("address").value="";
  document.getElementById("quantity").value=1;

}


// ========================
// SECURITY
// ========================

function escapeHtml(value){

  return String(value ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


loadProducts();

</script>

</body>
  </html>
