<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>FlashDrop Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
body{
  font-family:Arial;
  background:#f4f6fb;
  padding:20px;
}

.box{
  max-width:400px;
  margin:50px auto;
  background:white;
  padding:25px;
  border-radius:18px;
  box-shadow:0 5px 25px #0002;
}

input{
  width:100%;
  padding:14px;
  margin:8px 0;
  box-sizing:border-box;
  border:1px solid #ddd;
  border-radius:10px;
}

button{
  width:100%;
  padding:14px;
  background:#2563eb;
  color:white;
  border:0;
  border-radius:10px;
  font-size:16px;
  font-weight:bold;
}

#msg{
  margin-top:15px;
  padding:10px;
  border-radius:8px;
  display:none;
}
</style>
</head>

<body>

<div class="box">

<h2>🚀 FlashDrop Admin</h2>

<h3>🔐 دخول الإدارة</h3>

<input
id="email"
type="email"
value="chopsalah5@gmail.com"
placeholder="الإيميل">

<input
id="password"
type="password"
placeholder="كلمة السر">

<button onclick="login()">
دخول
</button>

<div id="msg"></div>

</div>

<script>

const URL =
"https://vadiyawqpbtdvnqmxxne.supabase.co";

const KEY =
"sb_publishable_MKv1kVwoBi6oEcrPIZMVMQ_Qk59pLSW";

const client =
window.supabase.createClient(URL,KEY);

function show(text){

const msg=document.getElementById("msg");

msg.style.display="block";
msg.innerText=text;

}

async function login(){

show("⏳ كنحاولو ندخلوك...");

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;

if(!email || !password){

show("❌ دخل الإيميل وكلمة السر");

return;

}

const result =
await client.auth.signInWithPassword({

email:email,

password:password

});

if(result.error){

show("❌ "+result.error.message);

return;

}

show("✅ دخلتي بنجاح!");

}

</script>

</body>
</html>
