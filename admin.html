<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FlashDrop Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,Tahoma,sans-serif;
  background:#f5f7fb;
  color:#172033;
}
header{
  background:#111827;
  color:white;
  padding:18px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}
.logo{
  font-size:22px;
  font-weight:bold;
}
button{
  border:0;
  border-radius:10px;
  padding:11px 16px;
  cursor:pointer;
  font-weight:bold;
}
.logout{background:#ef4444;color:white}

.login{
  max-width:420px;
  margin:70px auto;
  background:white;
  padding:28px;
  border-radius:20px;
  box-shadow:0 10px 35px #0001;
}
.login h1{text-align:center}
input,select,textarea{
  width:100%;
  padding:13px;
  margin:7px 0 12px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:15px;
}
textarea{min-height:90px}
.login button{
  width:100%;
  background:#2563eb;
  color:white;
}
.error{
  color:#dc2626;
  text-align:center;
  margin-top:10px;
}
#app{display:none}

.container{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:20px;
}
.card{
  background:white;
  border-radius:16px;
  padding:20px;
  box-shadow:0 5px 20px #0000000a;
}
.stat-title{color:#6b7280}
.stat-number{
  font-size:27px;
  font-weight:bold;
  margin-top:8px;
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:20px;
}
.primary{background:#2563eb;color:white}
.green{background:#16a34a;color:white}
.dark{background:#111827;color:white}

.section{
  background:white;
  border-radius:18px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 5px 20px #0000000a;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:800px;
}
.table-wrap{overflow:auto}
th,td{
  padding:12px;
  border-bottom:1px solid #eee;
  text-align:right;
}
th{background:#f8fafc}

.badge{
  padding:6px 10px;
  border-radius:20px;
  font-size:12px;
  display:inline-block;
}
.new{background:#dbeafe;color:#1d4ed8}
.processing{background:#fef3c7;color:#92400e}
.delivered{background:#dcfce7;color:#166534}
.cancelled,.returned{background:#fee2e2;color:#991b1b}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#0008;
  z-index:20;
  align-items:center;
  justify-content:center;
  padding:15px;
}
.modal-box{
  background:white;
  width:100%;
  max-width:550px;
  max-height:90vh;
  overflow:auto;
  border-radius:20px;
  padding:25px;
}
.modal-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.close{
  background:#eee;
  font-size:20px;
}

.product-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:15px;
}
.product{
  border:1px solid #eee;
  border-radius:15px;
  padding:12px;
}
.product img{
  width:100%;
  height:180px;
  object-fit:cover;
  border-radius:12px;
  background:#eee;
}
.product h3{margin:10px 0}
.product-actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}
.small{
  padding:8px 10px;
  font-size:12px;
}

@media(max-width:800px){
  .stats{
    grid-template-columns:repeat(2,1fr);
  }
  .product-grid{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<header>
  <div class="logo">🚀 FlashDrop Admin</div>
  <button class="logout" onclick="logout()">خروج</button>
</header>

<!-- LOGIN -->
<div id="loginPage" class="login">
  <h1>🔐 دخول الإدارة</h1>

  <label>البريد الإلكتروني</label>
  <input id="email" type="email" placeholder="البريد الإلكتروني">

  <label>كلمة المرور</label>
  <input id="password" type="password" placeholder="كلمة المرور">

  <button onclick="login()">دخول</button>

  <div id="loginError" class="error"></div>
</div>

<!-- ADMIN -->
<div id="app">

<div class="container">

  <div class="stats">

    <div class="card">
      <div class="stat-title">📦 المنتجات</div>
      <div id="productsCount" class="stat-number">0</div>
    </div>

    <div class="card">
      <div class="stat-title">🆕 الطلبات الجديدة</div>
      <div id="newOrders" class="stat-number">0</div>
    </div>

    <div class="card">
      <div class="stat-title">💰 المداخيل</div>
      <div id="revenue" class="stat-number">0 DH</div>
    </div>

    <div class="card">
      <div class="stat-title">📈 الربح</div>
      <div id="profit" class="stat-number">0 DH</div>
    </div>

  </div>

  <div class="actions">
    <button class="primary" onclick="openProductModal()">
      ➕ إضافة منتوج
    </button>

    <button class="green" onclick="loadAll()">
      🔄 تحديث
    </button>
  </div>

  <!-- PRODUCTS -->
  <div class="section">
    <h2>📦 المنتجات</h2>
    <div id="products" class="product-grid"></div>
  </div>

  <!-- ORDERS -->
  <div class="section">
    <h2>🛒 الطلبات</h2>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>الزبون</th>
            <th>الهاتف</th>
            <th>المدينة</th>
            <th>المنتوج</th>
            <th>الكمية</th>
            <th>المجموع</th>
            <th>الحالة</th>
            <th>التاريخ</th>
          </tr>
        </thead>

        <tbody id="orders"></tbody>
      </table>
    </div>
  </div>

</div>
</div>

<!-- PRODUCT MODAL -->
<div id="productModal" class="modal">

  <div class="modal-box">

    <div class="modal-head">
      <h2>➕ إضافة منتوج</h2>
      <button class="close" onclick="closeProductModal()">×</button>
    </div>

    <label>اسم المنتوج</label>
    <input id="pName" placeholder="مثال: حامل الهاتف">

    <label>الوصف</label>
    <textarea id="pDescription" placeholder="وصف المنتوج"></textarea>

    <label>رابط صورة المنتوج</label>
    <input id="pImage" placeholder="https://...">

    <label>ثمن الشراء</label>
    <input id="pCost" type="number" step="0.01" placeholder="مثال: 50">

    <label>الثمن القديم</label>
    <input id="pOldPrice" type="number" step="0.01" placeholder="مثال: 149">

    <label>ثمن البيع</label>
    <input id="pPrice" type="number" step="0.01" placeholder="مثال: 99">

    <label>المخزون</label>
    <input id="pStock" type="number" value="100">

    <label>القسم</label>
    <select id="pCategory">
      <option value="all">عام</option>
      <option value="home">المنزل</option>
      <option value="electronics">الإلكترونيات</option>
      <option value="accessories">الإكسسوارات</option>
      <option value="beauty">الجمال</option>
    </select>

    <button class="primary" style="width:100%" onclick="saveProduct()">
      💾 حفظ المنتوج
    </button>

    <div id="productError" class="error"></div>

  </div>
</div>

<script>

const SUPABASE_URL =
"https://vadiyawqpbtdvnqmxxne.supabase.co";

const SUPABASE_KEY =
"sb_publishable_MKv1kVwoBi6oEcrPIZMVMQ_Qk59pLSW";

const db = supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


// ========================
// LOGIN
// ========================

async function login(){

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  const errorBox =
    document.getElementById("loginError");

  errorBox.textContent="";

  if(!email || !password){
    errorBox.textContent="دخل البريد وكلمة المرور";
    return;
  }

  const {data,error} =
    await db.auth.signInWithPassword({
      email,
      password
    });

  if(error){
    errorBox.textContent =
      "خطأ: " + error.message;
    return;
  }

  if(!data.user){
    errorBox.textContent="ما قدرناش نجيبو الحساب";
    return;
  }

  // قراءة role من profiles
  const {data:profile,error:profileError} =
    await db
      .from("profiles")
      .select("role")
      .eq("id",data.user.id)
      .single();

  if(profileError){
    await db.auth.signOut();

    errorBox.textContent =
      "مشكل فقراءة صلاحية الحساب: "
      + profileError.message;

    return;
  }

  if(profile.role !== "admin"){

    await db.auth.signOut();

    errorBox.textContent =
      "هاد الحساب ماشي Admin";

    return;
  }

  showAdmin();
}


// ========================
// SESSION
// ========================

async function checkSession(){

  const {
    data:{session}
  } = await db.auth.getSession();

  if(!session){
    return;
  }

  const user = session.user;

  const {data:profile} =
    await db
      .from("profiles")
      .select("role")
      .eq("id",user.id)
      .single();

  if(profile && profile.role === "admin"){
    showAdmin();
  }
}


// ========================
// SHOW ADMIN
// ========================

function showAdmin(){

  document.getElementById("loginPage").style.display="none";

  document.getElementById("app").style.display="block";

  loadAll();
}


// ========================
// LOGOUT
// ========================

async function logout(){

  await db.auth.signOut();

  location.reload();
}


// ========================
// LOAD ALL
// ========================

async function loadAll(){

  await loadProducts();

  await loadOrders();

}


// ========================
// PRODUCTS
// ========================

async function loadProducts(){

  const {data,error} =
    await db
      .from("products")
      .select("*")
      .order("id",{ascending:false});

  if(error){
    alert(error.message);
    return;
  }

  document.getElementById("productsCount")
    .textContent=data.length;

  const box =
    document.getElementById("products");

  box.innerHTML="";

  data.forEach(p=>{

    const oldPrice =
      Number(p.old_price || 0);

    const price =
      Number(p.selling_price || 0);

    let discount="";

    if(oldPrice > price && oldPrice > 0){

      const percent =
        Math.round(
          ((oldPrice-price)/oldPrice)*100
        );

      discount =
        `<span class="badge new">-${percent}%</span>`;
    }

    box.innerHTML += `

      <div class="product">

        <img
          src="${p.image_url || 'https://via.placeholder.com/400'}"
          onerror="this.src='https://via.placeholder.com/400'"
        >

        <h3>${escapeHtml(p.name)}</h3>

        ${discount}

        <p>
          💰 البيع:
          <b>${price} DH</b>
        </p>

        <p>
          📦 المخزون:
          <b>${p.stock ?? 0}</b>
        </p>

        <p>
          الحالة:
          ${p.active
            ? '<span class="badge delivered">نشط</span>'
            : '<span class="badge cancelled">مخفي</span>'}
        </p>

        <div class="product-actions">

          <button
            class="small dark"
            onclick="toggleProduct(${p.id},${p.active})">
            ${p.active ? "إخفاء" : "تفعيل"}
          </button>

          <button
            class="small"
            style="background:#ef4444;color:white"
            onclick="deleteProduct(${p.id})">
            🗑️ حذف
          </button>

        </div>

      </div>
    `;
  });
}


// ========================
// ADD PRODUCT
// ========================

function openProductModal(){

  document.getElementById("productModal")
    .style.display="flex";

}


function closeProductModal(){

  document.getElementById("productModal")
    .style.display="none";

}


async function saveProduct(){

  const errorBox =
    document.getElementById("productError");

  errorBox.textContent="";

  const name =
    document.getElementById("pName").value.trim();

  const description =
    document.getElementById("pDescription").value.trim();

  const image =
    document.getElementById("pImage").value.trim();

  const cost =
    Number(document.getElementById("pCost").value);

  const oldPrice =
    Number(document.getElementById("pOldPrice").value);

  const price =
    Number(document.getElementById("pPrice").value);

  const stock =
    Number(document.getElementById("pStock").value);

  const category =
    document.getElementById("pCategory").value;


  if(!name){
    errorBox.textContent="دخل اسم المنتوج";
    return;
  }

  if(!price || price <= 0){
    errorBox.textContent="دخل ثمن البيع";
    return;
  }


  // إضافة المنتج
  const {data:product,error} =
    await db
      .from("products")
      .insert({
        name:name,
        description:description,
        image_url:image,
        selling_price:price,
        old_price:oldPrice || null,
        stock:stock,
        category:category,
        active:true
      })
      .select()
      .single();


  if(error){

    errorBox.textContent =
      error.message;

    return;
  }


  // إضافة تكلفة الشراء
  const {error:costError} =
    await db
      .from("product_costs")
      .insert({
        product_id:product.id,
        purchase_price:cost || 0
      });


  if(costError){

    errorBox.textContent =
      "المنتوج تزاد ولكن ثمن الشراء ما تسجلش: "
      + costError.message;

    return;
  }


  closeProductModal();

  document.getElementById("pName").value="";
  document.getElementById("pDescription").value="";
  document.getElementById("pImage").value="";
  document.getElementById("pCost").value="";
  document.getElementById("pOldPrice").value="";
  document.getElementById("pPrice").value="";
  document.getElementById("pStock").value="100";

  await loadProducts();

}


// ========================
// TOGGLE PRODUCT
// ========================

async function toggleProduct(id,current){

  const {error} =
    await db
      .from("products")
      .update({
        active:!current
      })
      .eq("id",id);

  if(error){
    alert(error.message);
    return;
  }

  loadProducts();
}


// ========================
// DELETE PRODUCT
// ========================

async function deleteProduct(id){

  if(!confirm("واش متأكد بغيتي تحذف هاد المنتوج؟")){
    return;
  }

  const {error} =
    await db
      .from("products")
      .delete()
      .eq("id",id);

  if(error){
    alert(error.message);
    return;
  }

  loadProducts();
}


// ========================
// ORDERS
// ========================

async function loadOrders(){

  const {data:orders,error} =
    await db
      .from("orders")
      .select("*")
      .order("created_at",{ascending:false});

  if(error){
    alert(error.message);
    return;
  }

  document.getElementById("newOrders")
    .textContent =
      orders.filter(o=>o.status==="new").length;


  let revenue=0;

  orders.forEach(o=>{
    revenue += Number(o.total || 0);
  });

  document.getElementById("revenue")
    .textContent =
      revenue.toFixed(2)+" DH";


  // الربح
  let profit=0;

  const {data:costs} =
    await db
      .from("product_costs")
      .select("product_id,purchase_price");

  const costMap={};

  (costs || []).forEach(c=>{
    costMap[c.product_id] =
      Number(c.purchase_price || 0);
  });


  orders.forEach(o=>{

    if(o.status === "cancelled" ||
       o.status === "returned"){
      return;
    }

    const cost =
      costMap[o.product_id] || 0;

    profit +=
      (Number(o.unit_price || 0)-cost)
      * Number(o.quantity || 0);

  });


  document.getElementById("profit")
    .textContent =
      profit.toFixed(2)+" DH";


  const box =
    document.getElementById("orders");

  box.innerHTML="";


  for(const order of orders){

    let productName="منتوج";

    const {data:product} =
      await db
        .from("products")
        .select("name")
        .eq("id",order.product_id)
        .maybeSingle();

    if(product){
      productName=product.name;
    }


    const statusText={
      new:"جديدة",
      processing:"قيد المعالجة",
      delivered:"تم التوصيل",
      cancelled:"ملغاة",
      returned:"رتور"
    };


    const statusClass =
      order.status || "new";


    box.innerHTML += `

      <tr>

        <td>${escapeHtml(order.customer_name || "")}</td>

        <td>${escapeHtml(order.phone || "")}</td>

        <td>${escapeHtml(order.city || "")}</td>

        <td>${escapeHtml(productName)}</td>

        <td>${order.quantity || 0}</td>

        <td>${Number(order.total || 0).toFixed(2)} DH</td>

        <td>

          <select
            onchange="changeOrderStatus(${order.id},this.value)"
          >

            <option value="new"
              ${order.status==="new"?"selected":""}>
              جديدة
            </option>

            <option value="processing"
              ${order.status==="processing"?"selected":""}>
              قيد المعالجة
            </option>

            <option value="delivered"
              ${order.status==="delivered"?"selected":""}>
              تم التوصيل
            </option>

            <option value="cancelled"
              ${order.status==="cancelled"?"selected":""}>
              ملغاة
            </option>

            <option value="returned"
              ${order.status==="returned"?"selected":""}>
              رتور
            </option>

          </select>

        </td>

        <td>
          ${new Date(order.created_at).toLocaleDateString("ar-MA")}
        </td>

      </tr>

    `;
  }

}


// ========================
// CHANGE ORDER STATUS
// ========================

async function changeOrderStatus(id,status){

  const {error} =
    await db
      .from("orders")
      .update({
        status:status,
        updated_at:new Date().toISOString()
      })
      .eq("id",id);

  if(error){

    alert(error.message);

    return;
  }

  loadOrders();
}


// ========================
// SECURITY HTML
// ========================

function escapeHtml(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


// تشغيل
checkSession();

</script>

</body>
</html>
