<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlashDrop Store</title>

<style>
*{
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  margin:0;
  background:#f5f6fa;
  color:#111827;
}

header{
  background:#111827;
  color:white;
  padding:18px;
  position:sticky;
  top:0;
  z-index:10;
}

.header-content{
  max-width:1100px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.logo{
  font-size:22px;
  font-weight:bold;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-bottom:20px;
}

.stat{
  background:white;
  border-radius:16px;
  padding:20px;
  box-shadow:0 3px 15px rgba(0,0,0,.06);
}

.stat-title{
  color:#6b7280;
  font-size:14px;
  margin-bottom:10px;
}

.stat-value{
  font-size:25px;
  font-weight:bold;
}

.actions{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:20px;
}

button{
  border:0;
  border-radius:12px;
  padding:13px 18px;
  background:#111827;
  color:white;
  font-size:15px;
  cursor:pointer;
}

button.blue{
  background:#2563eb;
}

button.green{
  background:#16a34a;
}

button.red{
  background:#dc2626;
}

.card{
  background:white;
  border-radius:16px;
  padding:20px;
  margin-bottom:20px;
  box-shadow:0 3px 15px rgba(0,0,0,.06);
}

.card h2{
  margin-top:0;
}

.order-form{
  display:none;
}

input{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:10px;
  margin-bottom:10px;
  font-size:15px;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.empty{
  text-align:center;
  color:#777;
  padding:35px;
}

.order{
  border:1px solid #eee;
  border-radius:12px;
  padding:15px;
  margin-bottom:12px;
}

.order-top{
  display:flex;
  justify-content:space-between;
  gap:10px;
  flex-wrap:wrap;
}

.badge{
  display:inline-block;
  padding:6px 10px;
  border-radius:20px;
  font-size:12px;
  background:#fef3c7;
  color:#92400e;
}

@media(max-width:700px){

  .stats{
    grid-template-columns:1fr 1fr;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .header-content{
    flex-direction:column;
  }
}

@media(max-width:450px){

  .stats{
    grid-template-columns:1fr;
  }

  .container{
    padding:12px;
  }
}
</style>
</head>

<body>

<header>

  <div class="header-content">

    <div class="logo">
      🚀 FlashDrop Store
    </div>

    <div>
      منصة إدارة الطلبات
    </div>

  </div>

</header>


<div class="container">

  <!-- الإحصائيات -->

  <div class="stats">

    <div class="stat">
      <div class="stat-title">
        📦 جميع الطلبات
      </div>

      <div class="stat-value" id="allOrders">
        0
      </div>
    </div>


    <div class="stat">
      <div class="stat-title">
        🆕 الطلبات الجديدة
      </div>

      <div class="stat-value" id="newOrders">
        0
      </div>
    </div>


    <div class="stat">
      <div class="stat-title">
        ✅ تم التوصيل
      </div>

      <div class="stat-value" id="deliveredOrders">
        0
      </div>
    </div>


    <div class="stat">
      <div class="stat-title">
        💰 المداخيل
      </div>

      <div class="stat-value" id="revenue">
        0 DH
      </div>
    </div>

  </div>


  <!-- الأزرار -->

  <div class="actions">

    <button
      class="blue"
      onclick="showOrderForm()"
    >
      ➕ إضافة كوموند
    </button>

    <button onclick="showOrders()">
      📦 جميع الطلبات
    </button>

    <button
      class="green"
      onclick="showDelivered()"
    >
      ✅ تم التوصيل
    </button>

    <button
      class="red"
      onclick="showCancelled()"
    >
      ❌ المرتجعات
    </button>

  </div>


  <!-- إضافة كوموند -->

  <div
    class="card order-form"
    id="orderForm"
  >

    <h2>
      ➕ إضافة كوموند جديدة
    </h2>

    <input
      type="text"
      id="customerName"
      placeholder="اسم الزبون"
    >

    <input
      type="tel"
      id="customerPhone"
      placeholder="رقم الهاتف"
    >

    <input
      type="text"
      id="customerCity"
      placeholder="المدينة"
    >

    <input
      type="text"
      id="customerAddress"
      placeholder="العنوان"
    >

    <div class="form-grid">

      <input
        type="text"
        id="productName"
        placeholder="اسم المنتج"
      >

      <input
        type="number"
        id="quantity"
        placeholder="الكمية"
        value="1"
        min="1"
      >

    </div>

    <input
      type="number"
      id="sellingPrice"
      placeholder="ثمن البيع DH"
    >

    <button
      class="green"
      onclick="addOrder()"
    >
      💾 حفظ الكوموند
    </button>

  </div>


  <!-- الطلبات -->

  <div class="card">

    <h2>
      📦 الكوموندات
    </h2>

    <div id="ordersList">

      <div class="empty">
        ما كاين حتى كوموند دابا
      </div>

    </div>

  </div>

</div>


<script>

let orders = [];


/* إظهار فورم الكوموند */

function showOrderForm(){

  const form =
    document.getElementById("orderForm");

  form.style.display =
    form.style.display === "block"
      ? "none"
      : "block";
}


/* إضافة كوموند */

function addOrder(){

  const name =
    document.getElementById("customerName")
    .value.trim();

  const phone =
    document.getElementById("customerPhone")
    .value.trim();

  const city =
    document.getElementById("customerCity")
    .value.trim();

  const address =
    document.getElementById("customerAddress")
    .value.trim();

  const product =
    document.getElementById("productName")
    .value.trim();

  const quantity =
    Number(
      document.getElementById("quantity").value
    );

  const price =
    Number(
      document.getElementById("sellingPrice").value
    );


  if(
    !name ||
    !phone ||
    !city ||
    !address ||
    !product ||
    !quantity ||
    !price
  ){

    alert("❌ دخل جميع المعلومات");

    return;
  }


  const order = {

    id: Date.now(),

    customerName: name,

    phone: phone,

    city: city,

    address: address,

    product: product,

    quantity: quantity,

    price: price,

    total: quantity * price,

    status: "new"

  };


  orders.unshift(order);

  saveOrders();

  renderOrders();

  clearForm();


  document.getElementById(
    "orderForm"
  ).style.display = "none";

}


/* حفظ الطلبات */

function saveOrders(){

  localStorage.setItem(
    "flashdrop_orders",
    JSON.stringify(orders)
  );

}


/* تحميل الطلبات */

function loadOrders(){

  const saved =
    localStorage.getItem(
      "flashdrop_orders"
    );


  if(saved){

    try{

      orders = JSON.parse(saved);

    }catch(error){

      orders = [];

    }

  }


  renderOrders();

}


/* عرض الطلبات */

function renderOrders(list = orders){

  const box =
    document.getElementById("ordersList");


  if(!list.length){

    box.innerHTML =
      '<div class="empty">ما كاين حتى كوموند</div>';

    updateStats();

    return;
  }


  box.innerHTML = "";


  list.forEach(order => {

    const div =
      document.createElement("div");

    div.className = "order";


    div.innerHTML = `

      <div class="order-top">

        <strong>
          👤 ${order.customerName}
        </strong>

        <span class="badge">
          ${getStatus(order.status)}
        </span>

      </div>

      <p>
        📞 ${order.phone}
      </p>

      <p>
        📍 ${order.city} - ${order.address}
      </p>

      <p>
        🛍️ ${order.product}
      </p>

      <p>
        🔢 الكمية: ${order.quantity}
      </p>

      <p>
        💰 المجموع:
        <strong>
          ${order.total} DH
        </strong>
      </p>

      <div class="actions">

        <button
          class="green"
          onclick="
            changeStatus(
              ${order.id},
              'delivered'
            )
          "
        >
          ✅ توصيل
        </button>


        <button
          class="red"
          onclick="
            changeStatus(
              ${order.id},
              'returned'
            )
          "
        >
          ↩️ رجوع
        </button>


        <button
          onclick="
            deleteOrder(${order.id})
          "
        >
          🗑️ حذف
        </button>

      </div>

    `;


    box.appendChild(div);

  });


  updateStats();

}


/* تغيير الحالة */

function changeStatus(id,status){

  const order =
    orders.find(
      o => o.id === id
    );


  if(!order) return;


  order.status = status;

  saveOrders();

  renderOrders();

}


/* حذف كوموند */

function deleteOrder(id){

  if(
    !confirm(
      "واش متأكد بغيتي تحيد هاد الكوموند؟"
    )
  ){

    return;
  }


  orders =
    orders.filter(
      o => o.id !== id
    );


  saveOrders();

  renderOrders();

}


/* جميع الطلبات */

function showOrders(){

  renderOrders(orders);

}


/* الطلبات الموصلة */

function showDelivered(){

  renderOrders(
    orders.filter(
      o => o.status === "delivered"
    )
  );

}


/* المرتجعات */

function showCancelled(){

  renderOrders(
    orders.filter(
      o => o.status === "returned"
    )
  );

}


/* الحالة */

function getStatus(status){

  if(status === "new")
    return "جديدة";

  if(status === "delivered")
    return "تم التوصيل";

  if(status === "returned")
    return "مرتجعة";

  return status;

}


/* الإحصائيات */

function updateStats(){

  document.getElementById(
    "allOrders"
  ).textContent = orders.length;


  document.getElementById(
    "newOrders"
  ).textContent =
    orders.filter(
      o => o.status === "new"
    ).length;


  document.getElementById(
    "deliveredOrders"
  ).textContent =
    orders.filter(
      o => o.status === "delivered"
    ).length;


  const revenue =
    orders
      .filter(
        o => o.status === "delivered"
      )
      .reduce(
        (sum,o) => sum + o.total,
        0
      );


  document.getElementById(
    "revenue"
  ).textContent =
    revenue + " DH";

}


/* مسح الفورم */

function clearForm(){

  document.getElementById(
    "customerName"
  ).value = "";

  document.getElementById(
    "customerPhone"
  ).value = "";

  document.getElementById(
    "customerCity"
  ).value = "";

  document.getElementById(
    "customerAddress"
  ).value = "";

  document.getElementById(
    "productName"
  ).value = "";

  document.getElementById(
    "quantity"
  ).value = "1";

  document.getElementById(
    "sellingPrice"
  ).value = "";

}


/* تشغيل المنصة */

loadOrders();

</script>

</body>
</html>
