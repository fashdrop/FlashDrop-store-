<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FlashDrop Admin</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 font-family:Arial,Tahoma,sans-serif;
 background:#f4f7fb;
 color:#172033;
}
header{
 background:linear-gradient(135deg,#0b9f57,#08783f);
 color:white;
 padding:17px;
}
.head{
 max-width:1200px;
 margin:auto;
 display:flex;
 justify-content:space-between;
 align-items:center;
}
.logo{font-size:22px;font-weight:bold}
.container{max-width:1200px;margin:auto;padding:18px}

.login{
 min-height:100vh;
 display:flex;
 align-items:center;
 justify-content:center;
 padding:20px;
}
.loginbox{
 width:100%;
 max-width:400px;
 background:white;
 padding:28px;
 border-radius:20px;
 box-shadow:0 8px 30px #0002;
}
.loginbox h2{text-align:center}
input,select,textarea{
 width:100%;
 padding:13px;
 margin:6px 0 14px;
 border:1px solid #ddd;
 border-radius:10px;
 font-size:15px;
}
button{
 border:0;
 border-radius:10px;
 padding:12px 16px;
 font-weight:bold;
 cursor:pointer;
}
.green{background:#0b9f57;color:white}
.gray{background:#edf1f5;color:#222}
.red{background:#e53935;color:white}
.full{width:100%}

nav{
 display:flex;
 gap:8px;
 overflow:auto;
 margin-bottom:18px;
}
nav button{
 background:white;
 box-shadow:0 2px 8px #0001;
 white-space:nowrap;
}
nav button.active{
 background:#0b9f57;
 color:white;
}

.stats{
 display:grid;
 grid-template-columns:repeat(4,1fr);
 gap:14px;
}
.stat{
 background:white;
 padding:18px;
 border-radius:17px;
 box-shadow:0 2px 12px #0001;
}
.stat small{color:#777}
.stat b{
 display:block;
 margin-top:7px;
 font-size:25px;
 color:#0b9f57;
}

.section{
 background:white;
 padding:18px;
 border-radius:17px;
 margin-bottom:18px;
 box-shadow:0 2px 12px #0001;
}
.top{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
 flex-wrap:wrap;
}

.products{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:15px;
}
.product{
 border:1px solid #eee;
 border-radius:15px;
 overflow:hidden;
}
.product img{
 width:100%;
 height:180px;
 object-fit:cover;
 background:#eee;
}
.pbody{padding:13px}
.price{
 color:#0b9f57;
 font-weight:bold;
 font-size:20px;
}
.old{
 color:#999;
 text-decoration:line-through;
 margin-right:7px;
}
.actions{
 display:flex;
 gap:7px;
 margin-top:10px;
}

.tablewrap{overflow:auto}
table{
 width:100%;
 min-width:850px;
 border-collapse:collapse;
}
th,td{
 padding:11px;
 border-bottom:1px solid #eee;
 text-align:right;
}

.modal{
 display:none;
 position:fixed;
 inset:0;
 background:#0008;
 align-items:center;
 justify-content:center;
 padding:15px;
 z-index:50;
}
.modalbox{
 background:white;
 width:100%;
 max-width:600px;
 max-height:92vh;
 overflow:auto;
 border-radius:20px;
 padding:20px;
}

.loading{
 text-align:center;
 padding:50px;
}

@media(max-width:800px){
 .stats{grid-template-columns:repeat(2,1fr)}
 .products{grid-template-columns:1fr 1fr}
}
@media(max-width:500px){
 .products{grid-template-columns:1fr}
}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginPage" class="login">

<div class="loginbox">

<h2>🔐 FlashDrop Admin</h2>

<p style="text-align:center;color:#777">
دخول المسؤول فقط
</p>

<label>البريد الإلكتروني</label>
<input
 id="email"
 type="email"
 placeholder="البريد الإلكتروني"
 autocomplete="email"
>

<label>كلمة المرور</label>
<input
 id="password"
 type="password"
 placeholder="كلمة المرور"
 autocomplete="current-password"
>

<button
 id="loginBtn"
 class="green full"
 onclick="login()"
>
دخول
</button>

<p id="loginError"
 style="color:#d32f2f;text-align:center">
</p>

</div>
</div>

<!-- ADMIN -->
<div id="adminPage" style="display:none">

<header>
 <div class="head">
  <div class="logo">🚀 FlashDrop Admin</div>

  <button class="gray" onclick="logout()">
   خروج
  </button>
 </div>
</header>

<div class="container">

<nav>
 <button class="active" onclick="page('home',this)">
  📊 الرئيسية
 </button>

 <button onclick="page('products',this)">
  📦 المنتجات
 </button>

 <button onclick="page('orders',this)">
  🛒 الطلبات
 </button>
</nav>

<!-- HOME -->
<div id="home">

<div class="stats">

<div class="stat">
<small>جميع الطلبات</small>
<b id="allOrders">0</b>
</div>

<div class="stat">
<small>طلبات جديدة</small>
<b id="newOrders">0</b>
</div>

<div class="stat">
<small>تم التوصيل</small>
<b id="delivered">0</b>
</div>

<div class="stat">
<small>المداخيل</small>
<b id="revenue">0 DH</b>
</div>

</div>

<div class="section" style="margin-top:18px">

<div class="top">
<h2>📊 الإحصائيات</h2>

<button class="green"
onclick="openModal()">
＋ إضافة منتوج
</button>
</div>

<p>↩️ الرتور: <b id="returned">0</b></p>

<p>❌ الملغاة: <b id="cancelled">0</b></p>

<p>💰 الربح: <b id="profit">0 DH</b></p>

</div>

</div>

<!-- PRODUCTS -->
<div id="products" style="display:none">

<div class="section">

<div class="top">

<h2>📦 المنتجات</h2>

<button class="green"
onclick="openModal()">
＋ إضافة منتوج
</button>

</div>

<div id="productsList"
class="products">

<div class="loading">
جاري تحميل المنتجات...
</div>

</div>

</div>

</div>

<!-- ORDERS -->
<div id="orders" style="display:none">

<div class="section">

<div class="top">

<h2>🛒 الطلبات</h2>

<button class="gray"
onclick="loadOrders()">
🔄 تحديث
</button>

</div>

<div class="tablewrap">

<table>

<thead>

<tr>
<th>الزبون</th>
<th>الهاتف</th>
<th>المدينة</th>
<th>المنتوج</th>
<th>الكمية</th>
<th>المجموع</th>
<th>الحالة</th>
<th>التاريخ</th>
</tr>

</thead>

<tbody id="ordersBody"></tbody>

</table>

</div>

</div>

</div>

</div>
</div>

<!-- PRODUCT MODAL -->

<div id="modal" class="modal">

<div class="modalbox">

<div class="top">

<h2>➕ إضافة منتوج</h2>

<button class="gray"
onclick="closeModal()">
✕
</button>

</div>

<label>اسم المنتوج</label>
<input id="pName" placeholder="مثال: Smart Watch">

<label>التصنيف</label>

<select id="pCategory">
<option value="all">الكل</option>
<option value="home">المنزل</option>
<option value="electronics">الإلكترونيات</option>
<option value="accessories">الإكسسوارات</option>
<option value="beauty">الجمال</option>
</select>

<label>ثمن البيع</label>
<input id="pSelling" type="number" step="0.01">

<label>الثمن القديم</label>
<input id="pOld" type="number" step="0.01">

<label>ثمن الشراء</label>
<input id="pCost" type="number" step="0.01">

<label>المخزون</label>
<input id="pStock" type="number" value="0">

<label>رابط صورة المنتوج</label>
<input id="pImage" placeholder="https://...">

<label>الوصف</label>
<textarea id="pDescription"></textarea>

<button class="green full"
onclick="saveProduct()">
💾 حفظ المنتوج
</button>

</div>
</div>

<script>

const SUPABASE_URL =
"https://vadiyawqpbtdvnqmxxne.supabase.co";

const SUPABASE_KEY =
"sb_publishable_MKv1kVwoBi6oEcrPIZMVMQ_Qk59pLSW";

const db = supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);

async function checkSession(){

 const {data,error} =
 await db.auth.getUser();

 if(error || !data.user){
  showLogin();
  return;
 }

 const {data:profile,error:profileError} =
 await db
 .from("profiles")
 .select("role")
 .eq("id",data.user.id)
 .single();

 if(profileError ||
    !profile ||
    profile.role !== "admin"){

  await db.auth.signOut();
  showLogin();
  return;
 }

 showAdmin();

}

function showLogin(){

 document.getElementById("loginPage")
 .style.display="flex";

 document.getElementById("adminPage")
 .style.display="none";

}

function showAdmin(){

 document.getElementById("loginPage")
 .style.display="none";

 document.getElementById("adminPage")
 .style.display="block";

 loadDashboard();
 loadProducts();
 loadOrders();

}

async function login(){

 const email =
 document.getElementById("email").value.trim();

 const password =
 document.getElementById("password").value;

 const errorBox =
 document.getElementById("loginError");

 const btn =
 document.getElementById("loginBtn");

 if(!email || !password){

  errorBox.textContent =
  "دخل الإيميل وكلمة المرور";

  return;
 }

 btn.disabled=true;
 btn.textContent="⏳ جاري الدخول...";
 errorBox.textContent="";

 const {data,error} =
 await db.auth.signInWithPassword({
  email:email,
  password:password
 });

 if(error){

  errorBox.textContent =
  "❌ "+error.message;

  btn.disabled=false;
  btn.textContent="دخول";

  return;
 }

 const {data:profile} =
 await db
 .from("profiles")
 .select("role")
 .eq("id",data.user.id)
 .single();

 if(!profile || profile.role !== "admin"){

  await db.auth.signOut();

  errorBox.textContent =
  "❌ هاد الحساب ماشي Admin";

  btn.disabled=false;
  btn.textContent="دخول";

  return;
 }

 showAdmin();

}

async function logout(){

 await db.auth.signOut();

 showLogin();

}

function page(name,btn){

 document.getElementById("home").style.display =
 name==="home" ? "block":"none";

 document.getElementById("products").style.display =
 name==="products" ? "block":"none";

 document.getElementById("orders").style.display =
 name==="orders" ? "block":"none";

 document.querySelectorAll("nav button")
 .forEach(x=>x.classList.remove("active"));

 btn.classList.add("active");

}

async function loadDashboard(){

 const {data,error} =
 await db
 .from("orders")
 .select("*");

 if(error) return;

 const delivered =
 data.filter(x=>x.status==="delivered");

 const fresh =
 data.filter(x=>x.status==="new");

 const returned =
 data.filter(x=>x.status==="returned");

 const cancelled =
 data.filter(x=>x.status==="cancelled");

 const revenue =
 delivered.reduce(
  (sum,x)=>sum+Number(x.total||0),0
 );

 document.getElementById("allOrders")
 .textContent=data.length;

 document.getElementById("newOrders")
 .textContent=fresh.length;

 document.getElementById("delivered")
 .textContent=delivered.length;

 document.getElementById("returned")
 .textContent=returned.length;

 document.getElementById("cancelled")
 .textContent=cancelled.length;

 document.getElementById("revenue")
 .textContent=
 revenue.toFixed(2)+" DH";

 document.getElementById("profit")
 .textContent=
 "كيحتاج تكلفة الشراء";
}

async function loadProducts(){

 const {data,error} =
 await db
 .from("products")
 .select("*")
 .order("id",{ascending:false});

 const box =
 document.getElementById("productsList");

 if(error){

  box.innerHTML=
  "<p>❌ "+error.message+"</p>";

  return;
 }

 if(!data.length){

  box.innerHTML=
  "<p>ماكاين حتى منتوج.</p>";

  return;
 }

 box.innerHTML="";

 data.forEach(p=>{

  const div =
  document.createElement("div");

  div.className="product";

  div.innerHTML=`

  <img
   src="${p.image_url || 'https://via.placeholder.com/500x350?text=FlashDrop'}"
   onerror="this.src='https://via.placeholder.com/500x350?text=FlashDrop'"
  >

  <div class="pbody">

   <h3>${safe(p.name)}</h3>

   <div class="price">
    ${Number(p.selling_price||0)} DH

    ${
     p.old_price
     ? `<span class="old">
       ${Number(p.old_price)} DH
       </span>`
     : ""
    }

   </div>

   <p>📦 المخزون: ${p.stock||0}</p>

   <p>
    ${p.active ? "🟢 ظاهر":"🔴 مخفي"}
   </p>

   <div class="actions">

   <button
    class="gray"
    onclick="toggleProduct(${p.id},${p.active})">
    ${p.active ? "إخفاء":"إظهار"}
   </button>

   <button
    class="red"
    onclick="deleteProduct(${p.id})">
    حذف
   </button>

   </div>

  </div>
  `;

  box.appendChild(div);

 });

}

async function toggleProduct(id,active){

 const {error} =
 await db
 .from("products")
 .update({active:!active})
 .eq("id",id);

 if(error){
  alert(error.message);
  return;
 }

 loadProducts();

}

async function deleteProduct(id){

 if(!confirm(
 "واش متأكد بغيتي تحيد المنتوج؟"
 )) return;

 const {error} =
 await db
 .from("products")
 .delete()
 .eq("id",id);

 if(error){
  alert(error.message);
  return;
 }

 loadProducts();

}

function openModal(){

 document.getElementById("modal")
 .style.display="flex";

}

function closeModal(){

 document.getElementById("modal")
 .style.display="none";

}

async function saveProduct(){

 const name =
 document.getElementById("pName")
 .value.trim();

 const category =
 document.getElementById("pCategory")
 .value;

 const selling =
 Number(document.getElementById("pSelling").value);

 const oldPrice =
 Number(document.getElementById("pOld").value)||null;

 const cost =
 Number(document.getElementById("pCost").value)||0;

 const stock =
 Number(document.getElementById("pStock").value)||0;

 const image =
 document.getElementById("pImage")
 .value.trim();

 const description =
 document.getElementById("pDescription")
 .value.trim();

 if(!name || !selling){

  alert("دخل اسم المنتوج وثمن البيع");

  return;
 }

 const {data:product,error} =
 await db
 .from("products")
 .insert({
  name:name,
  category:category,
  selling_price:selling,
  old_price:oldPrice,
  stock:stock,
  image_url:image,
  description:description,
  active:true
 })
 .select()
 .single();

 if(error){

  alert("❌ "+error.message);

  return;
 }

 const {error:costError} =
 await db
 .from("product_costs")
 .insert({
  product_id:product.id,
  purchase_price:cost
 });

 if(costError){

  alert(
   "المنتوج تزاد ولكن تكلفة الشراء ما تسجلاتش."
  );

 }

 closeModal();

 loadProducts();
 loadDashboard();

 alert("✅ المنتوج تزاد بنجاح");

}

async function loadOrders(){

 const {data,error} =
 await db
 .from("orders")
 .select(`
  *,
  products(name)
 `)
 .order("created_at",{ascending:false});

 const body =
 document.getElementById("ordersBody");

 if(error){

  body.innerHTML=
  `<tr><td colspan="8">
   ❌ ${error.message}
  </td></tr>`;

  return;
 }

 body.innerHTML="";

 data.forEach(o=>{

  const tr =
  document.createElement("tr");

  tr.innerHTML=`

  <td>${safe(o.customer_name)}</td>

  <td>
   <a href="tel:${safe(o.phone)}">
    ${safe(o.phone)}
   </a>
  </td>

  <td>${safe(o.city)}</td>

  <td>${safe(o.products?.name)}</td>

  <td>${o.quantity||1}</td>

  <td>
   ${Number(o.total||0).toFixed(2)} DH
  </td>

  <td>

   <select
    onchange="changeStatus(${o.id},this.value)">

    <option value="new"
    ${o.status==="new"?"selected":""}>
    🆕 جديدة
    </option>

    <option value="processing"
    ${o.status==="processing"?"selected":""}>
    🚚 توصيل
    </option>

    <option value="delivered"
    ${o.status==="delivered"?"selected":""}>
    ✅ توصلات
    </option>

    <option value="returned"
    ${o.status==="returned"?"selected":""}>
    ↩️ رتور
    </option>

    <option value="cancelled"
    ${o.status==="cancelled"?"selected":""}>
    ❌ ملغاة
    </option>

   </select>

  </td>

  <td>
   ${new Date(o.created_at)
    .toLocaleDateString("fr-MA")}
  </td>

  `;

  body.appendChild(tr);

 });

}

async function changeStatus(id,status){

 const {error} =
 await db
 .from("orders")
 .update({
  status:status,
  updated_at:new Date().toISOString()
 })
 .eq("id",id);

 if(error){

  alert(error.message);

  return;
 }

 loadOrders();
 loadDashboard();

}

function safe(v){

 return String(v||"")
 .replaceAll("&","&amp;")
 .replaceAll("<","&lt;")
 .replaceAll(">","&gt;")
 .replaceAll('"',"&quot;")
 .replaceAll("'","&#039;");

}

checkSession();

</script>

</body>
</html>
