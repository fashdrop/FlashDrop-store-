<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FlashDrop Admin</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f5f7fb;color:#172033}
header{background:#111827;color:#fff;padding:18px}
.head{max-width:1200px;margin:auto;display:flex;justify-content:space-between;align-items:center}
.logo{font-size:23px;font-weight:bold}.logo span{color:#22c55e}
.container{max-width:1200px;margin:auto;padding:20px}
.hero{background:linear-gradient(135deg,#111827,#2563eb);color:white;padding:30px;border-radius:20px;margin-bottom:20px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:15px}
.stat{background:white;padding:20px;border-radius:17px;box-shadow:0 4px 15px #0001}
.stat b{display:block;font-size:25px;margin-top:8px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}
.tab{background:white;padding:12px 16px;border-radius:10px}
.active{background:#2563eb;color:white}
.panel{background:white;padding:20px;border-radius:18px;margin-bottom:20px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
input,select{padding:12px;border:1px solid #ddd;border-radius:9px;width:100%}
button{border:0;border-radius:9px;padding:11px;cursor:pointer;font-weight:bold}
.primary{background:#2563eb;color:#fff}
.green{background:#16a34a;color:#fff}
.orange{background:#f59e0b;color:#fff}
.red{background:#dc2626;color:#fff}
.gray{background:#64748b;color:#fff}
.orders{display:grid;gap:13px}
.order{background:#fff;border:1px solid #e5e7eb;padding:16px;border-radius:15px}
.badge{padding:6px 10px;border-radius:20px;font-size:12px;font-weight:bold}
.new{background:#dbeafe;color:#1d4ed8}
.delivery{background:#fef3c7;color:#92400e}
.done{background:#dcfce7;color:#166534}
.ret{background:#fee2e2;color:#991b1b}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}
.products{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}
.product{background:#fff;border-radius:15px;overflow:hidden;box-shadow:0 3px 12px #0001}
.product-img{height:170px;background:#eef2ff;display:flex;align-items:center;justify-content:center;font-size:55px}
.product-body{padding:15px}
</style>
</head>

<body>

<header>
<div class="head">
<div class="logo">👑 FlashDrop <span>Admin</span></div>
<div>لوحة المسؤول</div>
</div>
</header>

<div class="container">

<div class="hero">
<h1>👑 لوحة التحكم</h1>
<p>هنا كتسير المنتجات والطلبات ديالك.</p>
</div>

<div class="stats">

<div class="stat">📦 جميع الطلبات<b id="all">0</b></div>
<div class="stat">🆕 جديدة<b id="new">0</b></div>
<div class="stat">🚚 توصيل<b id="delivery">0</b></div>
<div class="stat">✅ توصلات<b id="done">0</b></div>
<div class="stat">↩️ Retour<b id="returns">0</b></div>
<div class="stat">💰 المداخيل<b id="money">0 DH</b></div>

</div>

<div class="tabs">
<button class="tab active" onclick="section('dashboard')">📊 الرئيسية</button>
<button class="tab" onclick="section('products')">📦 المنتجات</button>
<button class="tab" onclick="section('orders')">🛒 الطلبات</button>
<button class="tab" onclick="section('returns')">↩️ Retour</button>
</div>


<section id="dashboard">

<div class="panel">
<h2>⚡ آخر الطلبات</h2>
<div id="latest" class="orders"></div>
</div>

</section>


<section id="products" style="display:none">

<div class="panel">

<h2>➕ إضافة منتوج</h2>

<div class="form">
<input id="pn" placeholder="اسم المنتوج">
<input id="pp" type="number" placeholder="ثمن البيع">
<input id="pc" type="number" placeholder="ثمن الشراء">
<input id="ps" type="number" placeholder="المخزون">
<input id="pi" placeholder="رابط صورة المنتوج">
</div>

<br>

<button class="primary" onclick="addProduct()">
➕ إضافة
</button>

</div>

<div class="panel">
<h2>📦 منتجاتي</h2>
<div id="productList" class="products"></div>
</div>

</section>


<section id="orders" style="display:none">

<div class="panel">

<h2>🛒 جميع الطلبات</h2>

<input id="search" placeholder="🔎 بحث..." oninput="renderOrders()">

<br><br>

<div id="orderList" class="orders"></div>

</div>

</section>


<section id="returns" style="display:none">

<div class="panel">

<h2>↩️ Retour</h2>

<div id="returnList" class="orders"></div>

</div>

</section>

</div>


<script>

let products=JSON.parse(
localStorage.getItem("flashdrop_products")||"[]"
);

let orders=JSON.parse(
localStorage.getItem("flashdrop_orders")||"[]"
);

function saveProducts(){
localStorage.setItem(
"flashdrop_products",
JSON.stringify(products)
);
}

function saveOrders(){
localStorage.setItem(
"flashdrop_orders",
JSON.stringify(orders)
);
}

function section(name){

["dashboard","products","orders","returns"].forEach(x=>{
document.getElementById(x).style.display=
x===name?"block":"none";
});

if(name==="dashboard")renderLatest();
if(name==="products")renderProducts();
if(name==="orders")renderOrders();
if(name==="returns")renderReturns();

}

function addProduct(){

const name=document.getElementById("pn").value.trim();
const price=Number(document.getElementById("pp").value);
const cost=Number(document.getElementById("pc").value);
const stock=Number(document.getElementById("ps").value);
const image=document.getElementById("pi").value.trim();

if(!name||!price){
alert("دخل الاسم والثمن");
return;
}

products.push({
id:Date.now(),
name,
price,
cost,
stock,
image
});

saveProducts();

document.getElementById("pn").value="";
document.getElementById("pp").value="";
document.getElementById("pc").value="";
document.getElementById("ps").value="";
document.getElementById("pi").value="";

renderProducts();

alert("✅ تزاد المنتوج");

}

function renderProducts(){

const box=document.getElementById("productList");
box.innerHTML="";

products.forEach(p=>{

box.innerHTML+=`

<div class="product">

<div class="product-img">
${p.image
?`<img src="${p.image}" style="width:100%;height:100%;object-fit:cover">`
:"📦"}
</div>

<div class="product-body">

<h3>${esc(p.name)}</h3>

<p>💰 البيع: ${p.price} DH</p>
<p>📦 المخزون: ${p.stock}</p>
<p>💵 الربح: ${Math.max(0,p.price-p.cost)} DH</p>

<button class="red"
onclick="deleteProduct(${p.id})">
🗑 حذف
</button>

</div>
</div>

`;

});

}

function deleteProduct(id){

if(!confirm("حذف المنتوج؟"))return;

products=products.filter(p=>p.id!==id);

saveProducts();
renderProducts();

}

function statusText(status){

if(status==="new")
return `<span class="badge new">جديدة</span>`;

if(status==="delivery")
return `<span class="badge delivery">قيد التوصيل</span>`;

if(status==="done")
return `<span class="badge done">تم التوصيل</span>`;

return `<span class="badge ret">Retour</span>`;

}

function card(o){

return`

<div class="order">

<b>👤 ${esc(o.customer)}</b>

<br>
📞 ${esc(o.phone)}

<hr>

📦 ${esc(o.product)}
<br>
🔢 الكمية: ${o.qty}
<br>
💰 المجموع: <b>${o.price*o.qty} DH</b>
<br>
📍 ${esc(o.city)} - ${esc(o.address)}

<br><br>

${statusText(o.status)}

<div class="actions">

<button class="orange"
onclick="change(${o.id},'delivery')">
🚚 توصيل
</button>

<button class="green"
onclick="change(${o.id},'done')">
✅ وصلات
</button>

<button class="red"
onclick="change(${o.id},'return')">
↩️ Retour
</button>

<button class="gray"
onclick="change(${o.id},'new')">
🆕 جديدة
</button>

<button class="red"
onclick="delOrder(${o.id})">
🗑 حذف
</button>

</div>

</div>

`;

}

function renderOrders(){

const box=document.getElementById("orderList");
const q=(document.getElementById("search").value||"").toLowerCase();

const list=orders.filter(o=>
`${o.customer} ${o.phone} ${o.product}`
.toLowerCase().includes(q)
);

box.innerHTML=list.length
?list.map(card).join("")
:"<p>📭 ماكايناش طلبات</p>";

}

function renderLatest(){

document.getElementById("latest").innerHTML=
orders.slice(0,5).map(card).join("")
||"<p>📭 ماكايناش طلبات</p>";

}

function renderReturns(){

const list=orders.filter(o=>o.status==="return");

document.getElementById("returnList").innerHTML=
list.map(card).join("")
||"<p>✅ ماكاين حتى Retour</p>";

}

function change(id,status){

const o=orders.find(x=>x.id===id);

if(!o)return;

o.status=status;

saveOrders();

update();
renderOrders();
renderLatest();
renderReturns();

}

function delOrder(id){

if(!confirm("واش متأكد؟"))return;

orders=orders.filter(o=>o.id!==id);

saveOrders();

update();
renderOrders();
renderLatest();
renderReturns();

}

function update(){

document.getElementById("all").textContent=orders.length;

document.getElementById("new").textContent=
orders.filter(o=>o.status==="new").length;

document.getElementById("delivery").textContent=
orders.filter(o=>o.status==="delivery").length;

document.getElementById("done").textContent=
orders.filter(o=>o.status==="done").length;

document.getElementById("returns").textContent=
orders.filter(o=>o.status==="return").length;

const money=orders
.filter(o=>o.status==="done")
.reduce((s,o)=>s+Number(o.price)*Number(o.qty||1),0);

document.getElementById("money").textContent=money+" DH";

}

function esc(t){

return String(t||"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}

update();
renderLatest();

</script>

</body>
</html>
