<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FlashDrop Admin - Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(135deg, #111827, #2563eb);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 22px;
      padding: 30px;
      box-shadow: 0 20px 50px rgba(0,0,0,.25);
    }

    .logo {
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin: 15px 0 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 14px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
    }

    button {
      width: 100%;
      margin-top: 22px;
      padding: 15px;
      border: 0;
      border-radius: 12px;
      background: #2563eb;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .7;
      cursor: not-allowed;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
      min-height: 22px;
    }

    .success {
      color: #16a34a;
    }

    .error {
      color: #dc2626;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">🚀 FlashDrop Admin</div>
    <div class="subtitle">🔐 دخول الإدارة</div>

    <form id="loginForm">

      <label>البريد الإلكتروني</label>
      <input
        type="email"
        id="email"
        placeholder="chopsalah5@gmail.com"
        required
      >

      <label>كلمة المرور</label>
      <input
        type="password"
        id="password"
        placeholder="•••••••••"
        required
      >

      <button type="submit" id="loginBtn">
        دخول
      </button>

      <div id="message"></div>

    </form>

  </div>

<script>

  // 🔴 حط معلومات Supabase ديالك هنا
  const SUPABASE_URL = "YOUR_SUPABASE_URL";
  const SUPABASE_ANON_KEY = "YOUR_SUPABASE_ANON_KEY";

  const supabaseClient = supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );

  const form = document.getElementById("loginForm");
  const button = document.getElementById("loginBtn");
  const message = document.getElementById("message");

  form.addEventListener("submit", async function(e) {

    e.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    message.textContent = "";
    message.className = "";

    button.disabled = true;
    button.textContent = "⏳ كنحاولو ندخلوك...";

    try {

      const { data, error } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

      if (error) {
        throw error;
      }

      message.textContent = "✅ تم الدخول بنجاح";
      message.className = "success";

      // بدّل admin.html باسم الصفحة الرئيسية ديالك
      setTimeout(() => {
        window.location.href = "admin.html";
      }, 700);

    } catch (error) {

      console.error(error);

      message.textContent =
        "❌ الإيميل أو كلمة المرور غير صحيحة";

      message.className = "error";

      button.disabled = false;
      button.textContent = "دخول";
    }

  });

</script>

</body>
</html>
